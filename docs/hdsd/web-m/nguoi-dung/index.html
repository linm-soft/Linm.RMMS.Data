    var DEFAULT_PASSWORD = "RMMS@2026";
    var q = document.getElementById("q");
    var role = document.getElementById("role");
    var unit = document.getElementById("unit");
    var rowsEl = document.getElementById("rows");
    var countEl = document.getElementById("count");
    var exportBtn = document.getElementById("export");

    function fold(value) {
      return (value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/g, "d")
        .replace(/Đ/g, "D")
        .toLowerCase();
    }

    function digits(value) {
      return (value || "").replace(/\D/g, "");
    }

    function matches(person, query) {
      if (!query) return true;
      var text = fold(query.trim());
      var phoneQuery = digits(query);
      if (fold(person.fullName).indexOf(text) >= 0) return true;
      if (phoneQuery && digits(person.phone).indexOf(phoneQuery) >= 0) return true;
      return false;
    }

    function visible() {
      var query = q.value;
      var roleValue = role.value;
      var unitValue = unit.value;
      return PEOPLE.filter(function (person) {
        if (roleValue && person.roles.indexOf(roleValue) < 0) return false;
        if (unitValue && person.sourceUnit !== unitValue) return false;
        return matches(person, query);
      });
    }

    function cell(value) {
      var el = document.createElement("td");
      el.textContent = value || "";
      return el;
    }

    function render() {
      var list = visible();
      rowsEl.replaceChildren();
      list.forEach(function (person) {
        var tr = document.createElement("tr");
        var name = cell(person.fullName);
        var account = cell(person.phone);
        account.className = "account";
        tr.append(name, account, cell(person.roles.join(", ")), cell(person.jobTitle), cell(person.sourceUnit));
        rowsEl.appendChild(tr);
      });
      countEl.textContent = list.length + " / " + PEOPLE.length + " người dùng";
      exportBtn.disabled = list.length === 0;
    }

    function xml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sheetCell(value) {
      return '<Cell><Data ss:Type="String">' + xml(value) + "</Data></Cell>";
    }

    function exportExcel() {
      var list = visible();
      var header = ["Tài khoản đăng nhập", "Mật khẩu", "Họ và tên", "Vai trò", "Mã nhân viên", "Chức danh", "Đơn vị", "Khối"];
      var body = list.map(function (person) {
        return "<Row>" + [
          person.phone,
          DEFAULT_PASSWORD,
          person.fullName,
          person.roles.join(", "),
          person.employeeCode,
          person.jobTitle,
          person.sourceUnit,
          person.block
        ].map(sheetCell).join("") + "</Row>";
      }).join("");
      var workbook = '<?xml version="1.0" encoding="UTF-8"?>' +
        '<?mso-application progid="Excel.Sheet"?>' +
        '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
        '<Worksheet ss:Name="Tai khoan"><Table>' +
        "<Row>" + header.map(sheetCell).join("") + "</Row>" +
        body +
        "</Table></Worksheet></Workbook>";
      var blob = new Blob([workbook], { type: "application/vnd.ms-excel" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Danh-sach-tai-khoan-RMMS.xls";
      link.click();
      URL.revokeObjectURL(link.href);
    }

    q.addEventListener("input", render);
    role.addEventListener("change", render);
    unit.addEventListener("change", render);
    exportBtn.addEventListener("click", exportExcel);
    render();
  </script>
