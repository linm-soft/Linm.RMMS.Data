  #rows tr { cursor: pointer; }
  .tag.ok { background: #d1fae5; color: var(--staff); }
  .tag.part { background: #fef3c7; color: #92400e; }
  .tag.bad { background: #ffedd5; color: var(--warn); }
  .tag.miss { background: #fee2e2; color: #991b1b; }

  #km-panel h2 { margin: 0 0 6px; font-size: 16px; }
  tr:hover { background: #f5f5f4; }
  tr.active { background: #eff6ff; }
  .tag { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
  .tag.manager { background: #ffedd5; color: var(--team); }
  .tag.staff { background: #d1fae5; color: var(--staff); }
  .tag.vp { background: #dbeafe; color: var(--vp); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 14px; }
  input, select { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input { min-width: 280px; }
  #detail { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  #detail h2 { margin: 0 0 6px; font-size: 18px; }
  .muted { color: var(--muted); }
  ul.clean { margin: 8px 0 0; padding-left: 18px; }
  code { font-size: 13px; }

      <td>${esc(s.holeKm)}</td>
      <td>${s.posts}</td>
      <td><span class="tag ${s.why === "ok" ? "ok" : "bad"}">${esc(WHY[s.why] || s.why)}</span></td>
    </tr>`).join("")}</tbody>
  </table>`;
}

function show(person) {
  current = person.employeeCode;
  const list = person.manages;
  const km = kmOf(person);
  detail.hidden = false;
  detail.innerHTML = `
    <h2>${esc(person.fullName)} ${kmTag(km.status)}</h2>
    <p class="muted">${esc(person.employeeCode)} · ${esc(person.phone)} · ${esc(person.username)} · ${esc(person.jobTitle)}</p>
    <p>Mã chức danh ${esc(person.jobTitleCode)} · package ${esc(person.packageCode)} / ${esc(person.roleCode)} · khối ${esc(person.block)} · org seed ${esc(person.orgCode)}</p>
    <p>Tuyến: ${person.routes.length ? esc(person.routes.join(" · ")) : "không gán"}</p>
    <p>Nguồn: ${esc(person.sourceUnit)}</p>
    <strong>Cột km trên đoạn được giao</strong>
    ${segTable(km.segs)}
    <strong>Nhân viên được quản lý: ${list.length}</strong>
    ${list.length ? '<ul class="clean">' + list.map((s) => `<li><code>${esc(s.employeeCode)}</code> ${esc(s.fullName)} <span class="muted">${esc(s.phone)} · ${esc(s.packageCode)} · ${esc(s.jobTitle)} · ${esc(s.via)}</span></li>`).join("") + "</ul>" : '<p class="muted">Không quản lý nhân viên khác. Chỉ dữ liệu của mã này.</p>'}
  `;
  render();
  detail.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render() {
  const query = q.value.trim().toLowerCase();
  const list = PEOPLE.filter((p) => {
    if (blockSel.value && p.block !== blockSel.value) return false;
    if (pkg.value === "manager" && !p.manager) return false;
    if (pkg.value === "staff" && p.manager) return false;
    if (pkg.value === "vp" && !p.vpLead) return false;
    if (kmf.value && kmOf(p).status !== kmf.value) return false;
    if (!query) return true;
    const blob = [p.fullName, p.username, p.phone, p.employeeCode, p.jobTitle, p.block, p.packageCode].join(" ").toLowerCase();
    return blob.includes(query);
  });
  rows.innerHTML = list.map((p) => {
    const km = kmOf(p);
    return `<tr data-u="${esc(p.employeeCode)}" class="${current === p.employeeCode ? "active" : ""}">
    <td><b>${esc(p.fullName)}</b><br><span class="muted">${esc(p.username)}</span>${p.vpLead ? ' <span class="tag vp">VP</span>' : ""}</td>
    <td>${esc(p.phone)}</td>
    <td><code>${esc(p.employeeCode)}</code></td>
    <td><span class="tag ${p.manager ? "manager" : "staff"}">${esc(p.jobTitleCode || p.packageCode)}</span><br><span class="muted">${esc(p.jobTitle)}</span></td>
    <td>${esc(p.block)}<br><span class="muted">org ${esc(p.orgCode)}</span></td>
    <td>${p.manages.length}</td>
    <td>${kmTag(km.status)}<br><span class="muted">${km.segs.filter((s) => s.why === "ok").length}/${km.segs.length} đoạn</span></td>
  </tr>`;
  }).join("") || '<tr><td colspan="7">Không có người khớp bộ lọc.</td></tr>';
  for (const tr of rows.querySelectorAll("tr[data-u]")) {
    tr.onclick = () => show(PEOPLE.find((p) => p.employeeCode === tr.dataset.u));
  }
}

q.oninput = render;
blockSel.onchange = render;
pkg.onchange = render;
kmf.onchange = render;
render();

</script>
</body>
</html>
