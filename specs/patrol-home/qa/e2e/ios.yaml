appId: org.linmsoft.rmms
---
# patrol-home · store A11/A9/A3 · guest home → Auth login → tab field → #sc-patrol-home
# cấm shot login-only cho A3 · cấm mfeStdUrl / start:std
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
    optional: true
- tapOn:
    text: "Tài khoản"
    optional: true
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
    optional: true
- tapOn:
    text: "Mật khẩu"
    optional: true
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "home-who"
    timeout: 20000
# iOS LinmTabBar children inherit resource-id tab-bar (không expose tab-field) — dùng tile-patrol + text
- tapOn:
    id: "tab-field"
    optional: true
- tapOn:
    id: "tile-patrol"
    optional: true
- tapOn:
    text: "Tuần đường"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- assertVisible:
    id: "patrol-hero"
- assertVisible:
    id: "btn-pin-here"
- assertVisible: "Ghim vị trí hiện tại"
- assertVisible: "Hôm nay"
- takeScreenshot: A3-CORE
