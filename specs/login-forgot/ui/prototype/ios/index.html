<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Quên mật khẩu · iOS</title>
  <style>
    :root {
      --ios-blue: #0C84C0;
      --ios-label: #1C1C1E;
      --ios-secondary: #8E8E93;
      --card: #fff;
      --surface: #F2F2F7;
      --danger: #F03C30;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #1c1c1e; color: var(--ios-label);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 390px; height: 844px; background: var(--surface);
      border-radius: 44px; overflow: hidden; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .forgot { height: 100%; display: flex; flex-direction: column; padding: 54px 0 28px; }
    .nav {
      display: flex; align-items: center; gap: 8px; padding: 0 16px 8px; min-height: 44px;
    }
    .nav button {
      border: 0; background: transparent; color: var(--ios-blue); font-size: 17px; cursor: pointer;
      padding: 8px 4px;
    }
    .nav h1 { flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 600; padding-right: 48px; }
    .brand { padding: 8px 28px 4px; text-align: center; }
    .logo {
      width: 96px; height: 96px; margin: 0 auto 12px; border-radius: 22px; overflow: hidden;
    }
    .logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .brand p {
      margin: 0; font-size: 22px; font-weight: 700; text-transform: uppercase; line-height: 1.25;
    }
    .field {
      margin: 0 20px 10px; background: var(--card); border-radius: 12px;
      padding: 0 14px; display: flex; align-items: center; gap: 10px; min-height: 52px;
    }
    
    .field .lead .ic, .field .trail .ic { width: 20px; height: 20px; display: block; }

    .field .lead {
      width: 22px; height: 22px; color: var(--ios-secondary); flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .field input {
      flex: 1; border: 0; outline: 0; font-size: 17px; font-family: inherit;
      background: transparent; padding: 14px 0; color: var(--ios-label);
    }
    .field .trail {
      border: 0; background: transparent; color: var(--ios-blue); cursor: pointer;
      padding: 8px; font-size: 15px; min-width: 44px; min-height: 44px;
    }
    .actions { padding: 12px 20px 0; }
    .btn-primary {
      background: var(--ios-blue); color: #fff; width: 100%; border: 0;
      border-radius: 12px; min-height: 44px; font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .hint {
      margin: 8px 24px 0; font-size: 13px; color: var(--ios-secondary); text-align: center; line-height: 1.4;
    }
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 36px; z-index: 20;
      background: rgba(28,28,30,.92); color: #fff; border-radius: 12px;
      padding: 12px 14px; font-size: 14px; display: none; text-align: center;
    }
    .toast.on { display: block; }
    .modal-scrim {
      position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 30;
      display: none; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-scrim.on { display: flex; }
    .modal {
      background: #fff; border-radius: 14px; width: 100%; max-width: 300px;
      padding: 20px 16px 12px; text-align: center;
    }
    .modal p { margin: 0 0 16px; font-size: 15px; line-height: 1.35; }
    .modal .row { display: flex; gap: 8px; }
    .modal .row button {
      flex: 1; border: 0; border-radius: 10px; min-height: 44px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .modal .cancel { background: #F2F2F7; color: var(--ios-label); }
    .modal .ok { background: var(--ios-blue); color: #fff; }
    .note { position: absolute; top: 12px; left: 0; right: 0; text-align: center; color: #aaa; font-size: 12px; }
  </style>
</head>
<body>

    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
      <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.6 10.6A2.5 2.5 0 0 0 13.4 13.4"/><path d="M9.9 5.1A10.5 10.5 0 0 1 12 5c6 0 10 7 10 7a17.6 17.6 0 0 1-3.2 3.9"/><path d="M6.1 6.1C3.9 7.8 2 12 2 12s4 7 10 7c1.3 0 2.5-.3 3.6-.7"/></symbol>
    </svg>

  <div class="note">DES-MOB-FORGOT · iOS 390×844 · feature login-forgot</div>
  <div class="phone">
    <div id="sc-forgot" data-des-id="DES-MOB-FORGOT" data-step="request" class="forgot">
      <div class="nav">
        <button type="button" id="btn-back" onclick="onBack()">‹ Quay lại</button>
        <h1>Quên mật khẩu</h1>
      </div>
      <div class="brand" data-des-id="DES-MOB-FORGOT-BRAND">
        <div class="logo"><img src="../assets/app-logo.png" alt="RMMS" width="96" height="96" /></div>
        <p>Quản lý bảo trì đường bộ</p>
      </div>
      <p class="hint" id="forgot-contact" data-des-id="DES-MOB-FORGOT-CONTACT">Liên hệ admin để được cung cấp</p>
    </div>
  </div>
  <script>
    function onBack() {
      /* pop Login — no OTP form, no leave modal */
    }
  </script>
</body>
</html>
