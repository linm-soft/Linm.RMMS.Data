appId: org.linmsoft.rmms
---
# login-forgot — contact-admin only (cấm OTP input)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "btn-home-login"
    timeout: 15000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "btn-forgot"
    timeout: 15000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-forgot"
- assertVisible:
    text: "Quên mật khẩu"
- assertVisible:
    id: "forgot-contact"
- assertVisible:
    text: "Liên hệ admin để được cung cấp"
- takeScreenshot: A9-LOGIN
- takeScreenshot: A3-CORE
- takeScreenshot: P6-CORE
- tapOn:
    text: "Kit"
    optional: true
- takeScreenshot: P6-CORE-2
