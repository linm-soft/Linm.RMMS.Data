appId: org.linmsoft.rmms
---
# login-forgot — stay on reset step so CLI store-px = core job (cấm login-only A3)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "btn-forgot"
    timeout: 15000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-forgot"
- assertVisible:
    text: "Quên mật khẩu"
- tapOn:
    id: "f-phone"
- inputText: "0900000000"
- tapOn:
    id: "btn-forgot-send"
- extendedWaitUntil:
    visible:
      id: "f-otp"
    timeout: 20000
- takeScreenshot: A9-LOGIN
- takeScreenshot: A3-CORE
- takeScreenshot: P6-CORE
- tapOn:
    text: "Kit"
    optional: true
- takeScreenshot: P6-CORE-2
