appId: org.linmsoft.rmms
---
# login-forgot — Pixel_2 · stay on reset step (core job)
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "btn-home-login"
    timeout: 15000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "btn-forgot"
    timeout: 15000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-forgot"
- assertVisible:
    text: "Quên mật khẩu"
- tapOn:
    id: "f-phone"
- inputText: "0900000000"
- hideKeyboard
- tapOn:
    id: "btn-forgot-send"
- extendedWaitUntil:
    visible:
      id: "f-otp"
    timeout: 20000
- takeScreenshot: A9-LOGIN
- takeScreenshot: A3-CORE
- takeScreenshot: P6-CORE
- tapOn:
    text: "Kit"
    optional: true
- takeScreenshot: P6-CORE-2
