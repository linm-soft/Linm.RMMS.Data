appId: org.linmsoft.rmms
---
# patrol-history-detail · store P6 ×2 · guest home → login → hub → history → #sc-patrol-detail
# Seed live RMMS: b33e0001-0001-4c01-8c01-000000000002 · PAT-20260810-0009
# Android login: IME Enter · cấm hideKeyboard · wait sc-home
# History row dưới fold — centerElement + swipe UP trước tap
# Pixel 1080×1920
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- inputText: "linm-soft"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 1500
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- tapOn:
    id: "tab-field"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "row-quick-patrol-history"
    direction: DOWN
    timeout: 20000
    speed: 40
    visibilityPercentage: 100
    centerElement: true
- swipe:
    direction: UP
    duration: 400
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "row-quick-patrol-history"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Lịch sử phiên"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-history"
    timeout: 25000
- assertVisible: "Lịch sử ca"
- tapOn:
    id: "row-history-b33e0001-0001-4c01-8c01-000000000002"
    optional: true
- tapOn:
    text: "PAT-20260810-0009"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "sc-patrol-detail"
    commands:
      - tapOn:
          point: "50%,32%"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-detail"
    timeout: 25000
- extendedWaitUntil:
    visible: "Chi tiết ca"
    timeout: 15000
- assertVisible: "Mã phiên"
- assertVisible: "PAT-20260810-0009"
- assertVisible: "Thông tin"
- takeScreenshot: P6-CORE
- scrollUntilVisible:
    element: "Điểm tuần"
    direction: DOWN
    timeout: 15000
- assertVisible: "Điểm tuần"
- assertVisible: "Km 1551+200 · Xuân Hải"
- scrollUntilVisible:
    element: "Kết thúc ca"
    direction: DOWN
    timeout: 15000
- assertVisible: "Mở bản đồ ca"
- assertVisible: "Kết thúc ca"
- takeScreenshot: P6-CORE-2
- assertVisible:
    id: "sc-patrol-detail"
