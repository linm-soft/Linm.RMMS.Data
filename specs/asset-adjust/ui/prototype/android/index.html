<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Cập nhật / bớt · Android</title>
  <style>
    :root {
      --md-primary: #0C84C0; --md-deep: #086A9A; --md-error: #B3261E; --md-success: #3CB448; --md-warn: #FCB43C;
      --surface: #FFFBFE; --card: #fff; --muted: #79747E; --label: #1C1B1F; --outline: #CAC4D0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Roboto", system-ui, sans-serif;
      background: #1c1c1e; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 412px; height: 915px; background: var(--surface); border-radius: 28px;
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }
    .top-bar {
      display: flex; align-items: center; gap: 4px;
      padding: 40px 8px 12px; background: var(--surface); min-height: 88px;
    }
    .icon-btn {
      width: 48px; height: 48px; border: 0; background: transparent; color: var(--label);
      cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 24px;
    }
    .nav-title { font-size: 22px; font-weight: 500; color: var(--label); flex: 1; }
    .search {
      margin: 0 16px 8px; padding: 12px 16px; background: #E7E0EC; border-radius: 28px;
      display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 16px;
    }
    .search .ic { width: 20px; height: 20px; flex-shrink: 0; }
    .content { flex: 1; overflow: auto; padding: 0 0 96px; }
    .card-group {
      margin: 8px 16px; background: var(--card); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--outline);
    }
    .row {
      display: flex; align-items: center; gap: 4px;
      padding: 14px 8px 14px 16px; border-bottom: 1px solid #F3EDF7;
    }
    .row:last-child { border-bottom: 0; }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; font-weight: 500; color: var(--label); }
    .row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .btn-text {
      border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer; min-height: 40px; padding: 0 8px; white-space: nowrap;
    }
    .btn-edit { color: var(--md-primary); }
    .btn-remove { color: var(--md-error); }
    .ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round; }
    .tab {
      position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
      background: #F3EDF7; border-top: 1px solid var(--outline);
      display: flex; padding: 8px 4px 16px;
    }
    .tab b { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); }
    .tab b.on { color: var(--md-primary); }
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 30;
      background: #313033; color: #fff; border-radius: 4px;
      padding: 14px 16px; font-size: 14px; display: none;
    }
    .toast.show { display: block; }
    .modal-backdrop {
      display: none; position: absolute; inset: 0; z-index: 25;
      background: rgba(0,0,0,.32); align-items: center; justify-content: center; padding: 24px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-card {
      width: 100%; max-width: 320px; background: #EEE8F4; border-radius: 28px; padding: 24px;
    }
    .modal-card h3 { margin: 0 0 12px; font-size: 22px; font-weight: 500; color: var(--label); }
    .modal-card p { margin: 0 0 24px; font-size: 14px; color: var(--muted); line-height: 1.4; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-filled {
      width: 100%; min-height: 48px; border: 0; border-radius: 24px; font: inherit;
      font-size: 14px; font-weight: 500; cursor: pointer;
    }
    .btn-danger-filled { background: var(--md-error); color: #fff; }
    .btn-outline {
      width: 100%; min-height: 48px; border: 1px solid var(--outline); border-radius: 24px;
      background: transparent; color: var(--md-primary); font: inherit; font-size: 14px;
      font-weight: 500; cursor: pointer;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16.5 16.5 21 21"/></symbol>
  </svg>

  <div class="phone" id="sc-asset-adjust" data-des-id="DES-MOB-ASSET-ADJUST" data-tab="home">
    <div class="top-bar solid">
      <button type="button" class="icon-btn" id="asset-adjust-back" aria-label="Back" onclick="toast('Tài sản')">
        <svg class="ic" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
      </button>
      <div class="nav-title">Cập nhật / bớt</div>
    </div>
    <div class="search" id="asset-adjust-search" role="search">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
      <span>Tìm mã TS cần sửa hoặc bớt…</span>
    </div>
    <div class="content">
      <div class="card-group" id="asset-adjust-list">
        <div class="row" data-id="demo-1" data-code="TS-20260810-014">
          <div class="row-body">
            <div class="row-title">TS-20260810-014 · Cống ngang</div>
            <div class="row-sub">QL.1 · Km 1556+000</div>
          </div>
          <button type="button" class="btn-text btn-edit" id="asset-adjust-edit-1" onclick="toast('Chi tiết')">Sửa</button>
          <button type="button" class="btn-text btn-remove" id="asset-adjust-remove-1" onclick="openModal()">Bớt</button>
        </div>
      </div>
    </div>
    <div class="tab" data-des-id="DES-MOB-TABBAR">
      <b class="on" id="tab-home">Trang Chủ</b><b>Tuần đường</b><b>Vấn đề</b><b>Công việc</b><b>Tôi</b>
    </div>
    <div class="modal-backdrop" id="md-asset-remove" data-des-id="DES-MOB-ASSET-REMOVE">
      <div class="modal-card" role="dialog" aria-labelledby="md-title">
        <h3 id="md-title">Bớt tài sản khỏi sổ?</h3>
        <p>Ẩn khỏi danh sách hiện trường (không xóa hẳn). Có thể khôi phục trên Web.</p>
        <div class="modal-actions">
          <button type="button" class="btn-filled btn-danger-filled" id="md-confirm" onclick="confirmRemove()">Bớt khỏi sổ</button>
          <button type="button" class="btn-outline" id="md-cancel" onclick="closeModal()">Giữ lại</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    let t;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(t);
      t = setTimeout(() => el.classList.remove('show'), 1600);
    }
    function openModal() {
      document.getElementById('md-asset-remove').classList.add('show');
    }
    function closeModal() {
      document.getElementById('md-asset-remove').classList.remove('show');
    }
    function confirmRemove() {
      closeModal();
      toast('Đã bớt tài sản · TS-20260810-014');
    }
  </script>
</body>
</html>
