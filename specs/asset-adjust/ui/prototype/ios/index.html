<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Cập nhật / bớt · iOS</title>
  <style>
    :root {
      --blue: #0C84C0; --deep: #086A9A; --success: #3CB448; --warn: #FCB43C; --danger: #FF3B30;
      --surface: #F2F2F7; --card: #fff; --muted: #8E8E93; --label: #1C1C1E; --sep: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #1c1c1e; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 390px; height: 844px; background: var(--surface); border-radius: 44px;
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }
    .nav-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 54px 8px 10px; background: rgba(255,255,255,.92); border-bottom: 0.5px solid var(--sep);
      min-height: 96px;
    }
    .nav-btn {
      min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--blue);
      font: inherit; font-size: 17px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 2px; padding: 0 8px;
    }
    .nav-title { font-size: 17px; font-weight: 600; color: var(--label); letter-spacing: -0.2px; }
    .nav-spacer { width: 88px; }
    .search {
      margin: 8px 16px; padding: 10px 12px; background: #E5E5EA; border-radius: 10px;
      display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 16px;
    }
    .search .ic { width: 18px; height: 18px; flex-shrink: 0; }
    .content { flex: 1; overflow: auto; padding: 0 0 100px; }
    .card-group {
      margin: 8px 16px; background: var(--card); border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .row {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 12px 12px 16px; border-bottom: 0.5px solid #EFEFF4;
    }
    .row:last-child { border-bottom: 0; }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; font-weight: 600; color: var(--label); }
    .row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .btn {
      border: 0; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; min-height: 32px; padding: 6px 10px; white-space: nowrap;
    }
    .btn-secondary { background: #E5E5EA; color: var(--label); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-primary { background: var(--danger); color: #fff; width: 100%; min-height: 48px; font-size: 17px; border-radius: 12px; }
    .btn-keep { background: #E5E5EA; color: var(--label); width: 100%; min-height: 48px; font-size: 17px; border-radius: 12px; font-weight: 600; border: 0; cursor: pointer; }
    .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round; }
    .ic-sm { width: 18px; height: 18px; }
    .tab {
      position: absolute; left: 0; right: 0; bottom: 0; height: 83px;
      background: rgba(255,255,255,.92); border-top: 0.5px solid var(--sep);
      display: flex; padding: 6px 4px 28px;
    }
    .tab b { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); }
    .tab b.on { color: var(--blue); }
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 30;
      background: rgba(28,28,30,.92); color: #fff; border-radius: 12px;
      padding: 12px 14px; font-size: 15px; display: none;
    }
    .toast.show { display: block; }
    .modal-backdrop {
      display: none; position: absolute; inset: 0; z-index: 25;
      background: rgba(0,0,0,.4); align-items: center; justify-content: center; padding: 24px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-card {
      width: 100%; background: #fff; border-radius: 14px; padding: 20px 16px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
    }
    .modal-card h3 { margin: 0 0 8px; font-size: 17px; font-weight: 600; color: var(--label); text-align: center; }
    .modal-card p { margin: 0 0 16px; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.4; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16.5 16.5 21 21"/></symbol>
  </svg>

  <div class="phone" id="sc-asset-adjust" data-des-id="DES-MOB-ASSET-ADJUST" data-tab="home">
    <div class="nav-bar solid">
      <button type="button" class="nav-btn" id="asset-adjust-back" aria-label="Back" onclick="toast('Tài sản')">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg> Tài sản
      </button>
      <div class="nav-title">Cập nhật / bớt</div>
      <div class="nav-spacer"></div>
    </div>
    <div class="search" id="asset-adjust-search" role="search">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
      <span>Tìm mã TS cần sửa hoặc bớt…</span>
    </div>
    <div class="content">
      <div class="card-group" id="asset-adjust-list">
        <div class="row" data-id="demo-1" data-code="TS-20260810-014">
          <div class="row-body">
            <div class="row-title">TS-20260810-014 · Cống ngang</div>
            <div class="row-sub">QL.1 · Km 1556+000</div>
          </div>
          <button type="button" class="btn btn-secondary" id="asset-adjust-edit-1" onclick="toast('Chi tiết')">Sửa</button>
          <button type="button" class="btn btn-danger" id="asset-adjust-remove-1" onclick="openModal()">Bớt</button>
        </div>
        <div class="row" data-id="demo-2" data-code="TS-20260809-088">
          <div class="row-body">
            <div class="row-title">TS-20260809-088 · Biển P.127</div>
            <div class="row-sub">HCM · Biển báo</div>
          </div>
          <button type="button" class="btn btn-secondary" id="asset-adjust-edit-2" onclick="toast('Chi tiết')">Sửa</button>
          <button type="button" class="btn btn-danger" id="asset-adjust-remove-2" onclick="openModal()">Bớt</button>
        </div>
      </div>
    </div>
    <div class="tab" data-des-id="DES-MOB-TABBAR">
      <b class="on" id="tab-home">Trang Chủ</b><b>Tuần đường</b><b>Vấn đề</b><b>Công việc</b><b>Tôi</b>
    </div>
    <div class="modal-backdrop" id="md-asset-remove" data-des-id="DES-MOB-ASSET-REMOVE">
      <div class="modal-card" role="dialog" aria-labelledby="md-title">
        <h3 id="md-title">Bớt tài sản khỏi sổ?</h3>
        <p>Ẩn khỏi danh sách hiện trường (không xóa hẳn). Có thể khôi phục trên Web.</p>
        <div class="modal-actions">
          <button type="button" class="btn-primary" id="md-confirm" onclick="confirmRemove()">Bớt khỏi sổ</button>
          <button type="button" class="btn-keep" id="md-cancel" onclick="closeModal()">Giữ lại</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    let t;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(t);
      t = setTimeout(() => el.classList.remove('show'), 1600);
    }
    function openModal() {
      document.getElementById('md-asset-remove').classList.add('show');
    }
    function closeModal() {
      document.getElementById('md-asset-remove').classList.remove('show');
    }
    function confirmRemove() {
      closeModal();
      toast('Đã bớt tài sản · TS-20260810-014');
    }
  </script>
</body>
</html>
