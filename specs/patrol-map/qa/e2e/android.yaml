appId: org.linmsoft.rmms
---
# patrol-map · Android · guest/home → login Auth seed → tab field → #sc-patrol-map
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Đăng nhập"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Dành cho cán bộ"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 20000
- tapOn:
    id: "f-user"
- inputText: "linm-soft"
- tapOn:
    id: "f-pass"
- inputText: "Linm@2026"
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "btn-login"
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 60000
- tapOn:
    id: "tab-field"
    optional: true
- tapOn:
    text: "Tuần đường"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 25000
- scrollUntilVisible:
    element:
      id: "row-quick-patrol-map"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "row-quick-patrol-map"
    optional: true
- tapOn:
    text: "Bản đồ ca"
    optional: true
- tapOn:
    text: "Tiếp tục bản đồ"
    optional: true
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "sc-patrol-map"
    timeout: 45000
- assertVisible: "Ghim vị trí hiện tại"
- takeScreenshot: A3-CORE-MAP
