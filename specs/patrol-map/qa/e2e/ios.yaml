appId: com.drvn.rmms
---
# patrol-map · iOS · guest/home → login Auth seed → tab field → #sc-patrol-map
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Đăng nhập"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Dành cho cán bộ"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 20000
- tapOn:
    id: "f-user"
- inputText: "linm-soft"
- tapOn:
    id: "f-pass"
- inputText: "Linm@2026"
- tapOn:
    id: "btn-login"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- tapOn:
    id: "tab-field"
    optional: true
- tapOn:
    id: "tile-patrol"
    optional: true
- tapOn:
    text: "Tuần đường"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 25000
- tapOn:
    id: "row-quick-patrol-map"
    optional: true
- tapOn:
    text: "Bản đồ ca"
    optional: true
- tapOn:
    text: "Tiếp tục bản đồ"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-map"
    timeout: 30000
- assertVisible: "Ca đang chạy"
- assertVisible: "Ghim vị trí hiện tại"
- takeScreenshot: A3-CORE-MAP
