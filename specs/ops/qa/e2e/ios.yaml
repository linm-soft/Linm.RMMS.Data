appId: org.linmsoft.rmms
---
# ops · guest home → Auth login → tab Tôi → #row-ops → #sc-ops (live/EmptyChrome · cấm demo SC-2401)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
    optional: true
- tapOn:
    text: "Tài khoản"
    optional: true
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
    optional: true
- tapOn:
    text: "Mật khẩu"
    optional: true
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "home-who"
    timeout: 20000
- tapOn:
    id: "tab-me"
    optional: true
- tapOn:
    text: "Tôi"
    optional: true
- extendedWaitUntil:
    visible: "Hàng đợi mất sóng"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "row-ops"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "row-ops"
- extendedWaitUntil:
    visible:
      id: "sc-ops"
    timeout: 20000
- assertVisible:
    id: "sc-ops"
# live-only after cleanup_mock — EmptyChrome ops-empty OK khi GET empty/fail
- takeScreenshot: A3-CORE
