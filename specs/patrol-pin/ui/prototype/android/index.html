<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Ghim vị trí hiện tại · Android</title>
  <style>
    :root {
      --blue: #0C84C0; --green: #34C759; --orange: #FF9500;
      --surface: #F2F2F7; --card: #fff; --label: #1C1C1E; --muted: #8E8E93;
      --sep: rgba(60,60,67,.29);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Roboto", "Noto Sans", sans-serif;
      background: #1c1c1e; color: var(--label);
    }
    .phone {
      width: 412px; height: 915px; background: var(--surface); border-radius: 28px;
      overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: flex; flex-direction: column;
    }
    .status-bar { height: 36px; flex-shrink: 0; }
    .top-bar {
      padding: 12px 16px 14px; font-size: 22px; font-weight: 600; background: var(--card);
      border-bottom: 1px solid var(--sep);
    }
    .screen { flex: 1; overflow: auto; padding-bottom: 88px; display: none; }
    .screen.active { display: block; }
    .hero {
      margin: 16px 16px 0; padding: 16px; background: var(--card); border-radius: 16px;
    }
    .hero .sub { font-size: 13px; color: var(--muted); }
    .hero .title { font-size: 16px; font-weight: 600; margin-top: 4px; }
    .btn {
      margin: 16px 16px 0; width: calc(100% - 32px); border: 0; border-radius: 24px;
      padding: 14px 16px; font-size: 16px; font-weight: 600; color: #fff; background: var(--blue);
      display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    }
    .btn.secondary { background: var(--surface); color: var(--label); border-radius: 24px; }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }
    .map-wrap {
      margin: 12px 16px; height: 480px; border-radius: 16px; overflow: hidden; position: relative;
      background: linear-gradient(160deg, #d4e8f5 0%, #b8d4c8 45%, #e8e0c8 100%);
    }
    .map-road {
      position: absolute; left: 18%; right: 18%; top: 8%; bottom: 8%;
      background: #9aa3ad; border-radius: 8px; opacity: .55;
    }
    .pin {
      position: absolute; width: 28px; height: 28px; color: var(--blue);
      transform: translate(-50%, -100%); filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
    }
    .pin.here { color: #E53935; left: 52%; top: 48%; }
    .pin.plan { color: var(--blue); left: 40%; top: 36%; opacity: .7; }
    .map-card {
      position: absolute; left: 12px; right: 12px; bottom: 12px;
      background: rgba(255,255,255,.96); border-radius: 16px; padding: 12px;
    }
    .map-card .t { font-size: 13px; color: var(--muted); }
    .map-card .n { font-size: 16px; font-weight: 600; margin: 2px 0 10px; }
    .map-pin-here { width: 100%; margin: 0; }
    .hint { margin: 12px 16px 0; font-size: 13px; color: var(--muted); }
    .toast {
      position: absolute; left: 24px; right: 24px; bottom: 120px; z-index: 20;
      background: #323232; color: #fff; font-size: 14px;
      padding: 14px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s;
      pointer-events: none; text-align: center;
    }
    .toast.show { opacity: 1; }
    .backdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); display: none;
      align-items: center; justify-content: center; padding: 28px; z-index: 30;
    }
    .backdrop.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 28px; padding: 24px 20px 16px; width: 100%;
    }
    .modal h3 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
    .modal p { font-size: 13px; color: var(--muted); margin: 0 0 16px; line-height: 1.4; }
    .modal .btn { width: 100%; margin: 0 0 8px; }
    .nav {
      position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
      background: var(--card); border-top: 1px solid var(--sep);
      display: flex; padding: 8px 0 16px; z-index: 10;
    }
    .nav button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; color: var(--muted); background: none; border: 0; cursor: pointer;
    }
    .nav button.on { color: var(--blue); }
    .nav svg { width: 24px; height: 24px; fill: currentColor; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar" aria-hidden="true"></div>

    <!-- Hub · #sc-patrol-home · DES-MOB-CI-PIN-HERE · default · map: ?surface=map -->
    <div class="screen active" id="sc-patrol-home" data-des-id="DES-MOB-CI-PIN-HERE">
      <div class="top-bar">Tuần đường</div>
      <div class="hero">
        <div class="sub">Ca đang chạy</div>
        <div class="title">QL.1 · Km 1561+134 · Phước Dinh</div>
      </div>
      <button type="button" class="btn btn-primary pin-here" id="btn-pin-here" data-des-id="DES-MOB-CI-PIN-HERE" onclick="pinHereCheckin()">
        <svg viewBox="0 0 24 24"><use href="#i-mappin"/></svg>
        Ghim vị trí hiện tại
      </button>
      <p class="hint">Live GPS · toast lý trình · handoff Ghi điểm tuần (sibling · không form trên pack này).</p>
    </div>

    <!-- Map · #sc-patrol-map · reuse CTA -->
    <div class="screen" id="sc-patrol-map" data-des-id="DES-MOB-CI-PIN-HERE">
      <div class="top-bar">Bản đồ ca</div>
      <div class="map-wrap" id="map-canvas">
        <div class="map-road" aria-hidden="true"></div>
        <svg class="pin plan" viewBox="0 0 24 24"><use href="#i-mappin"/></svg>
        <svg class="pin here" id="pin-here" hidden viewBox="0 0 24 24"><use href="#i-mappin"/></svg>
        <div class="map-card">
          <div class="t">Điểm kế hoạch</div>
          <div class="n">Km 1561+134 · Phước Dinh</div>
          <button type="button" class="btn btn-primary map-pin-here" data-des-id="DES-MOB-CI-PIN-HERE" onclick="pinHereCheckin()">
            <svg viewBox="0 0 24 24"><use href="#i-mappin"/></svg>
            Ghim vị trí hiện tại
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <div class="backdrop" id="modal-gps" data-des-id="DES-MOB-GPS-DENY">
      <div class="modal">
        <h3>Định vị bị tắt</h3>
        <p>Cần vị trí để chấm công / chấm điểm tuần. Mở Cài đặt → Quyền vị trí cho RMMS.</p>
        <button type="button" class="btn" onclick="copyGuide()">Sao chép hướng dẫn</button>
        <button type="button" class="btn secondary" onclick="closeModal()">Để sau</button>
      </div>
    </div>

    <nav class="nav" aria-label="Shell Tab 5">
      <button type="button"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg>Trang chủ</button>
      <button type="button" class="on"><svg viewBox="0 0 24 24"><use href="#i-walk"/></svg>Tuần đường</button>
      <button type="button"><svg viewBox="0 0 24 24"><use href="#i-camera"/></svg>Hiện trường</button>
      <button type="button"><svg viewBox="0 0 24 24"><use href="#i-box"/></svg>Tài sản</button>
      <button type="button"><svg viewBox="0 0 24 24"><use href="#i-user"/></svg>Tôi</button>
    </nav>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <!-- SSOT path = mobile-p1 #i-mappin · parity dual -->
    <symbol id="i-mappin" viewBox="0 0 24 24">
      <path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/>
      <circle cx="12" cy="10" r="2.2"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13.5" cy="5" r="2"/><path d="M10 21l2-6 2 2 3 4M9 11l3 2 4-3 2 1"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4V8z"/><circle cx="12" cy="13" r="3.2"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21 3 16.5v-9z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.8-3.2 4-4.5 7-4.5s5.2 1.3 7 4.5"/></symbol>
  </svg>

  <script>
    /** Demo loc mode: allow | deny | timeout — ?deny=1 | ?timeout=1 */
    let locMode = 'allow';
    if (location.search.includes('deny=1')) locMode = 'deny';
    if (location.search.includes('timeout=1')) locMode = 'timeout';

    const ROUTE = 'QL.1 · Km 1561+134';
    const ACC_M = 4;

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    (function initSurface() {
      const map = location.search.includes('surface=map');
      document.getElementById('sc-patrol-home').classList.toggle('active', !map);
      document.getElementById('sc-patrol-map').classList.toggle('active', map);
    })();

    function pinHereCheckin() {
      if (locMode === 'deny') {
        document.getElementById('modal-gps').classList.add('open');
        return;
      }
      if (locMode === 'timeout') {
        toast('Chưa lấy được vị trí. Thử lại.');
        return;
      }
      const pin = document.getElementById('pin-here');
      if (pin) pin.hidden = false;
      toast('Đã ghim vị trí hiện tại · ' + ROUTE + ' · ±' + ACC_M + ' m');
      // Handoff sibling patrol-checkin — stub toast only · cấm open check-in form
      setTimeout(() => toast('Handoff · Ghi điểm tuần (sibling)'), 2600);
    }

    function copyGuide() {
      closeModal();
      toast('Đã sao chép: Cài đặt → Quyền vị trí');
    }

    function closeModal() {
      document.getElementById('modal-gps').classList.remove('open');
    }
  </script>
</body>
</html>
