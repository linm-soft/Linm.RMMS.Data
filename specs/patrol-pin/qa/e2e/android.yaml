appId: org.linmsoft.rmms
---
# patrol-pin · store P6 ×2 · login Auth seed → hub pin CTA · map pin CTA (Pixel 1080×1920)
# Submit qua ImeAction trên f-pass (pressKey Enter) · title tap optional nếu đã vào home
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Đăng nhập"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "btn-login"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- tapOn:
    id: "tab-field"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- assertVisible:
    id: "btn-pin-here"
- assertVisible: "Ghim vị trí hiện tại"
- takeScreenshot: P6-CORE
- tapOn:
    text: "Tiếp tục bản đồ"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-map"
    timeout: 20000
- assertVisible:
    id: "btn-pin-here"
- assertVisible: "Ghim vị trí hiện tại"
- takeScreenshot: P6-CORE-2
