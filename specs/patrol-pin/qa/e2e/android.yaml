appId: org.linmsoft.rmms
---
# patrol-pin · store P6 ×2 · guest → login → hub pin CTA · map pin CTA (Pixel 1080×1920)
# Login: Back dismiss IME + scroll btn-login · cấm title-tap/Enter (đẩy pass vào f-user)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- pressKey: Back
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Back
- scrollUntilVisible:
    element:
      id: "btn-login"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "btn-login"
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "tab-field"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- assertVisible:
    id: "btn-pin-here"
- assertVisible: "Ghim vị trí hiện tại"
- takeScreenshot: P6-CORE
- tapOn:
    text: "Tiếp tục bản đồ"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-map"
    timeout: 20000
- assertVisible:
    id: "btn-pin-here"
- assertVisible: "Ghim vị trí hiện tại"
- takeScreenshot: P6-CORE-2
