appId: org.linmsoft.rmms
---
# mnt-log · store A11/A9/A3 · guest → login → tile-mnt → #sc-mnt-list → log btn → #sc-mnt-log
# iOS LinmStrokeGlyph list chưa expose resource-id (GAP-MOB-A11Y-01) — tap middle action trên card demo-wo-2
# cấm scroll text "Đã hoàn thành" (NFC/NFD a11y) · dùng card id
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "tile-mnt"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "tile-mnt"
    optional: true
- tapOn:
    id: "tab-work"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-mnt-list"
    timeout: 25000
- assertVisible: "Danh sách công việc"
- assertVisible:
    id: "row-mnt-hub"
- scrollUntilVisible:
    element:
      id: "card-mnt-demo-wo-2"
    direction: DOWN
    timeout: 15000
- assertVisible: "Nạo cống"
- assertVisible:
    id: "card-mnt-demo-wo-2"
- tapOn:
    id: "btn-mnt-log-demo-wo-2"
    optional: true
# middle action on done card ≈ 50% x · ~72% y (Pro Max hierarchy)
- tapOn:
    point: "50%,72%"
- extendedWaitUntil:
    visible:
      id: "sc-mnt-log"
    timeout: 25000
- assertVisible: "Nhật ký xử lý"
- assertVisible:
    id: "wo-title"
- assertVisible:
    id: "wo-code"
- assertVisible:
    id: "wo-status"
- assertVisible:
    id: "section-log"
- takeScreenshot: A3-CORE
- scroll
- takeScreenshot: P6-CORE
- takeScreenshot: P6-CORE-2
