appId: org.linmsoft.rmms
---
# vis-capture · store A11/A9/A3 · guest → login → tile-incident → banner → #sc-vis-capture
# slug only · cấm sibling create/detail/cam-patrol · cấm A3 trước login · cấm mfeStdUrl
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "tile-incident"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "tile-incident"
    optional: true
- tapOn:
    id: "tab-incident"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-incident-list"
    timeout: 25000
- assertVisible: "Nhận diện mặt đường"
- assertVisible:
    id: "row-inc-banner-vis"
- tapOn:
    id: "row-inc-banner-vis"
- extendedWaitUntil:
    visible:
      id: "sc-vis-capture"
    timeout: 25000
- assertVisible: "Nhận diện mặt đường"
- assertVisible: "Ảnh hiện trường"
- assertVisible:
    id: "photo-row"
    optional: true
- assertVisible:
    id: "i-camera"
    optional: true
- assertVisible:
    id: "row-loc"
- assertVisible:
    id: "row-acc"
- assertVisible:
    id: "row-class"
- assertVisible:
    id: "row-sev"
- assertVisible:
    id: "btn-attach"
- assertVisible:
    id: "btn-skip"
- assertVisible: "Gắn sự cố"
- assertVisible: "Bỏ qua"
# NFC/NFD a11y: cấm assert chữ «đã chốt»/«±» — chờ animation sau GPS bootstrap
- waitForAnimationToEnd:
    timeout: 12000
- assertVisible: "Ảnh hiện trường"
- assertVisible: "Gắn sự cố"
- takeScreenshot: A3-CORE
