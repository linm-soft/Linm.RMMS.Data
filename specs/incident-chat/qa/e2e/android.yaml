appId: org.linmsoft.rmms
---
# incident-chat · P1 toast · Pixel 1080×1920 · P6 ×2
# guest → login → list → tap #i-chat → toast «Trao đổi sự cố» · P6-CORE-2 = list + chat entry fold
# cấm hideKeyboard (BACK → launcher) · cấm sheet P1
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "tile-incident"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "tile-incident"
    optional: true
- tapOn:
    id: "tab-incident"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-incident-list"
    timeout: 25000
- assertVisible: "Quản lý vấn đề"
- assertVisible: "Nứt mặt đường"
- tapOn:
    id: "btn-inc-chat-4b0d2722-e072-4775-8976-ec06952fc804"
    optional: true
- runFlow:
    when:
      notVisible: "Trao đổi sự cố"
    commands:
      - tapOn:
          id: "btn-inc-chat-demo-inc-1"
          optional: true
      - tapOn:
          text: "Trao đổi"
          optional: true
      - tapOn:
          point: "22%,48%"
- extendedWaitUntil:
    visible: "Trao đổi sự cố"
    timeout: 8000
- assertVisible: "Trao đổi sự cố"
- assertVisible:
    id: "sc-incident-list"
- takeScreenshot: P6-CORE
- scroll
- assertVisible:
    id: "sc-incident-list"
- assertVisible: "Trao đổi"
- takeScreenshot: P6-CORE-2
