appId: org.linmsoft.rmms
---
# incident-chat · P1 toast «Trao đổi sự cố» · entry #i-chat on #sc-incident-list
# store A11/A9/A3 · guest → login → tile/tab incident → tap chat → toast
# cấm A3 trước login · cấm sheet/composer · cấm sibling detail/create as in-scope
# Seed BFF X-Company-Id:LINM · VD-20260829-0001 id 4b0d2722-e072-4775-8976-ec06952fc804 · demo fallback demo-inc-1
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "tile-incident"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "tile-incident"
    optional: true
- tapOn:
    id: "tab-incident"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-incident-list"
    timeout: 25000
- assertVisible: "Quản lý vấn đề"
- assertVisible: "Nứt mặt đường"
- tapOn:
    id: "btn-inc-chat-4b0d2722-e072-4775-8976-ec06952fc804"
    optional: true
- runFlow:
    when:
      notVisible: "Trao đổi sự cố"
    commands:
      - tapOn:
          id: "btn-inc-chat-demo-inc-1"
          optional: true
      - tapOn:
          text: "Trao đổi"
          optional: true
      - tapOn:
          point: "28%,54%"
- extendedWaitUntil:
    visible: "Trao đổi sự cố"
    timeout: 8000
- assertVisible: "Trao đổi sự cố"
- assertVisible:
    id: "sc-incident-list"
- takeScreenshot: A3-CORE
