<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Chi tiết ngày công · iOS</title>
  <style>
    :root {
      --blue: #0C84C0; --deep: #086A9A; --success: #34C759; --warn: #FCB43C;
      --surface: #F2F2F7; --card: #fff; --muted: #8E8E93; --label: #1C1C1E; --sep: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #1c1c1e; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 390px; height: 844px; background: var(--surface); border-radius: 44px;
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }
    .nav-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 54px 8px 10px; background: rgba(255,255,255,.92); border-bottom: 0.5px solid var(--sep);
      min-height: 96px;
    }
    .nav-btn {
      min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--blue);
      font: inherit; font-size: 17px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 2px; padding: 0 8px;
    }
    .nav-title { font-size: 17px; font-weight: 600; color: var(--label); letter-spacing: -0.2px; }
    .nav-spacer { width: 88px; }
    .content { flex: 1; overflow: auto; padding: 0 0 100px; }
    .hero {
      padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .hero-day { font-size: 28px; font-weight: 700; color: var(--label); letter-spacing: -0.4px; }
    .badge {
      font-size: 13px; font-weight: 650; padding: 4px 10px; border-radius: 8px; white-space: nowrap;
    }
    .badge.green { background: rgba(52,199,89,.18); color: #1B5E20; }
    .badge.gray { background: rgba(142,142,147,.18); color: #636366; }
    .card-group {
      margin: 8px 16px; background: var(--card); border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .row { padding: 12px 16px; border-bottom: 0.5px solid #EFEFF4; }
    .row:last-child { border-bottom: 0; }
    .row.tappable { cursor: pointer; }
    .row-sub { font-size: 13px; color: var(--muted); }
    .row-title { font-size: 16px; font-weight: 600; color: var(--label); margin-top: 2px; }
    .section-label {
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .02em; margin: 16px 20px 8px;
    }
    .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round; }
    .ic-sm { width: 18px; height: 18px; }
    .tab {
      position: absolute; left: 0; right: 0; bottom: 0; height: 83px;
      background: rgba(255,255,255,.92); border-top: 0.5px solid var(--sep);
      display: flex; padding: 6px 4px 28px;
    }
    .tab b { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); }
    .tab b.on { color: var(--blue); }
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 20;
      background: rgba(28,28,30,.92); color: #fff; border-radius: 12px;
      padding: 12px 14px; font-size: 15px; display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  </svg>

  <div class="phone" id="sc-attendance-day" data-des-id="DES-MOB-ATT-DAY" data-tab="field">
    <div class="nav-bar solid">
      <button type="button" class="nav-btn" aria-label="Back" onclick="toast('Chấm công')">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg> Chấm công
      </button>
      <div class="nav-title">Chi tiết ngày công</div>
      <div class="nav-spacer"></div>
    </div>
    <div class="content">
      <div class="hero">
        <div class="hero-day" id="attendance-day-hero">T7 09/08</div>
        <span class="badge green" id="attendance-day-badge">Đủ công</span>
      </div>
      <div class="card-group">
        <div class="row"><div class="row-sub">Khoảng giờ</div><div class="row-title" id="attendance-day-range">07:05 – 16:40</div></div>
        <div class="row"><div class="row-sub">Tuyến · ca</div><div class="row-title" id="attendance-day-route">QL.1 · Ca sáng</div></div>
        <div class="row"><div class="row-sub">Số lần chấm</div><div class="row-title" id="attendance-day-count">2 lần chấm</div></div>
      </div>
      <div class="section-label">Các lần chấm</div>
      <div class="card-group" id="attendance-day-logs">
        <div class="row tappable" id="attendance-day-log-1" onclick="toast('Chi tiết lần chấm')">
          <div class="row-title">07:05</div>
          <div class="row-sub">QL.1 · Đúng tuyến · Trong vùng</div>
        </div>
        <div class="row tappable" id="attendance-day-log-2" onclick="toast('Chi tiết lần chấm')">
          <div class="row-title">16:40</div>
          <div class="row-sub">QL.1 · Đúng tuyến · Trong vùng</div>
        </div>
      </div>
    </div>
    <div class="tab" data-des-id="DES-MOB-TABBAR">
      <b>Trang Chủ</b><b class="on" id="tab-field">Tuần đường</b><b>Vấn đề</b><b>Công việc</b><b>Tôi</b>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__t);
      window.__t = setTimeout(function () { el.classList.remove('show'); }, 1800);
    }
  </script>
</body>
</html>
