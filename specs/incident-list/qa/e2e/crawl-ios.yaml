appId: com.drvn.rmms
---
# crawl · incident-list
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Dành cho cán bộ"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "rmms-admin"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "RMMS@2026"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-who"
    timeout: 40000

- tapOn:
    id: "tab-incident"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- tapOn:
    point: "50%,96%"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-incident-list"
    timeout: 20000

- tapOn:
    id: "row-inc-banner-vis"
    optional: true
- tapOn:
    text: "Nhận diện MD"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-vis-capture"
    timeout: 8000
- takeScreenshot: CRAWL-vis
- tapOn:
    id: "tab-incident"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- tapOn:
    point: "50%,96%"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- tapOn:
    point: "50%,96%"
    optional: true


- tapOn:
    id: "fab-inc-create"
    optional: true
- tapOn:
    text: "Ghi sự cố"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-inc-pick"
    timeout: 8000
- takeScreenshot: CRAWL-fab
- tapOn:
    id: "tab-incident"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- tapOn:
    point: "50%,96%"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- tapOn:
    point: "50%,96%"
    optional: true

