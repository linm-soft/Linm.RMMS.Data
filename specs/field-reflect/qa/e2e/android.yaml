- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "ONLY THIS TIME"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-field-reflect"
    timeout: 25000
- assertVisible: "Ghi nhận hư hỏng"
- assertVisible:
    id: "kind-pills"
    optional: true
- takeScreenshot: P6-CORE
- scroll
