      text: "Cầu"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Cầu"
- tapOn:
    id: "ak32-BRIDGE"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "ONLY THIS TIME"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-inc-form"
    timeout: 30000
- assertVisible: "Ghi sự cố"
- assertVisible:
    id: "inc-photos"
    optional: true
- assertVisible:
    id: "kit-linm-image-upload"
    optional: true
- assertVisible:
    id: "photo-slot"
    optional: true
- assertVisible:
    id: "btn-add"
    optional: true
- assertVisible:
    id: "attachment-bind"
    optional: true
- takeScreenshot: P6-CORE
- scroll
- scroll
- assertVisible:
    id: "btn-create"
    optional: true
- assertVisible:
    id: "btn-draft"
    optional: true
- takeScreenshot: P6-CORE-2
