appId: org.linmsoft.rmms
---
# patrol-checkin · store P6 ×2 · guest → login → sheet · CORE sớm · scroll fold 2
# Login: Back dismiss IME + scroll btn-login · cấm title-tap/Enter (đẩy pass vào f-user)
# live-only · cấm demo Phước Dinh · cấm hideKeyboard sau sheet (đóng ModalBottomSheet)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- pressKey: Back
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Back
- scrollUntilVisible:
    element:
      id: "btn-login"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "btn-login"
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "tab-field"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- assertVisible:
    id: "patrol-hero"
- tapOn:
    text: "Ghi điểm tuần"
- extendedWaitUntil:
    visible: "Điểm kế hoạch"
    timeout: 20000
- extendedWaitUntil:
    visible: "Đúng điểm"
    timeout: 35000
    optional: true
- takeScreenshot: P6-CORE
- tapOn: "Nội dung"
- inputText: "Mat duong kho, lan can dat"
- waitForAnimationToEnd:
    timeout: 2000
- scroll
- assertVisible: "Ảnh"
- takeScreenshot: P6-CORE-2
- tapOn:
    text: "Ghi nhận điểm tuần"
    optional: true
- tapOn:
    text: "Lưu"
    optional: true
- extendedWaitUntil:
    visible: "Đã lưu"
    timeout: 12000
    optional: true
