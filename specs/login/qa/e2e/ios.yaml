appId: org.linmsoft.rmms
---
# Login e2e — Auth seed · iOS hint text · Android resource-id · dismiss AutoFill
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Đăng nhập"
    timeout: 15000
- takeScreenshot: A11-LAUNCH
- takeScreenshot: A3-CORE
- takeScreenshot: P6-CORE
- tapOn:
    id: "f-user"
    optional: true
- tapOn:
    text: "Tài khoản"
    optional: true
- inputText: "linm-soft"
- tapOn:
    id: "f-pass"
    optional: true
- tapOn:
    text: "Mật khẩu"
    optional: true
- inputText: "Linm@2026"
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Đăng xuất"
    timeout: 25000
- takeScreenshot: A9-LOGIN
- tapOn:
    text: "Kit"
    optional: true
- takeScreenshot: P6-CORE-2
