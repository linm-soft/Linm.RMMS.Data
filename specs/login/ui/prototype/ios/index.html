<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Login · iOS</title>
  <link rel="stylesheet" href="../net-signal.css" />
  <style>
    :root {
      --ios-blue: #0C84C0;
      --ios-label: #1C1C1E;
      --ios-secondary: #8E8E93;
      --ios-gray: #8E8E93;
      --card: #fff;
      --surface: #F2F2F7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #1c1c1e; color: var(--ios-label);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 390px; height: 844px; background: var(--surface);
      border-radius: 44px; overflow: hidden; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .screen { position: absolute; inset: 0; display: none; }
    .screen.on { display: block; }
    .login { height: 100%; display: flex; flex-direction: column; padding: 54px 0 28px; }
    .login-main { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
    .login-brand { padding: 0 28px 4px; text-align: center; }
    .login-logo {
      width: 96px; height: 96px; margin: 0 auto 12px; background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,.14); border-radius: 22px; overflow: hidden;
    }
    .login-logo img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .login-brand p { margin: 4px 0 0; font-size: 15px; color: var(--ios-secondary); line-height: 1.35; }
    .login-form { margin-top: 20px; }
    .login-field {
      margin: 0 20px 10px; background: var(--card); border-radius: 12px;
      padding: 0 14px; display: flex; align-items: center; gap: 10px; min-height: 52px;
    }
    .login-field .lead { color: var(--ios-gray); width: 22px; display: grid; place-items: center; }
    .login-field input {
      flex: 1; border: 0; outline: 0; font-size: 17px; font-family: inherit;
      background: transparent; padding: 14px 0; color: var(--ios-label);
    }
    .login-field .trail {
      border: 0; background: transparent; color: var(--ios-blue); cursor: pointer;
      font-size: 18px; padding: 8px; display: grid; place-items: center;
    }
    .login-actions { padding: 12px 20px 0; }
    .btn-primary {
      background: var(--ios-blue); color: #fff; width: 100%; border: 0;
      border-radius: 12px; min-height: 44px; font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .login-meta {
      margin-top: auto; padding: 16px 24px 8px; text-align: center;
      font-size: 12px; color: var(--ios-secondary); line-height: 1.45;
    }
    .login-meta a { color: var(--ios-blue); text-decoration: none; font-weight: 500; }
    .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 36px; z-index: 20;
      background: rgba(28,28,30,.92); color: #fff; border-radius: 12px;
      padding: 12px 14px; font-size: 14px; display: none; text-align: center;
    }
    .toast.on { display: block; }
    .note { position: absolute; top: 12px; left: 0; right: 0; text-align: center; color: #aaa; font-size: 11px; }
  </style>
</head>
<body>
  <div class="note">DES-MOB-LOGIN · iOS 390×844 · feature login</div>
  <div class="phone">
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
      <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.8-3.2 4.2-4.5 7-4.5s5.2 1.3 7 4.5"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 10.6A2.5 2.5 0 0 0 13.4 13.4"/><path d="M9.9 5.1A10.5 10.5 0 0 1 12 5c6 0 10 7 10 7a17.6 17.6 0 0 1-3.2 3.9"/><path d="M6.1 6.1C3.9 7.8 2 12 2 12s4 7 10 7c1.3 0 2.5-.3 3.6-.7"/></symbol>
    </svg>
    <div class="screen on" id="sc-login" data-des-id="DES-MOB-LOGIN" data-tab="auth">
      <div class="login">
        <div class="login-main">
          <div class="login-brand" data-des-id="DES-MOB-LOGIN-BRAND">
            <div class="login-logo">
              <img src="../assets/app-logo.png" alt="RMMS" width="96" height="96" />
            </div>
            <p>Quản lý bảo trì đường bộ<br/>Hiện trường · iPhone</p>
          </div>
          <div class="login-form" data-des-id="DES-MOB-LOGIN-FORM">
            <div class="login-field">
              <span class="lead"><svg class="ic" viewBox="0 0 24 24"><use href="#i-person"/></svg></span>
              <input id="f-user" type="text" placeholder="Tài khoản" value="linm-soft" autocomplete="username" />
            </div>
            <div class="login-field">
              <span class="lead"><svg class="ic" viewBox="0 0 24 24"><use href="#i-lock"/></svg></span>
              <input id="f-pass" type="password" placeholder="Mật khẩu" value="••••••••" autocomplete="current-password" />
              <button class="trail" type="button" id="btnEye" aria-label="Hiện mật khẩu" onclick="togglePass()">
                <svg class="ic" viewBox="0 0 24 24"><use href="#i-eye" id="eyeUse"/></svg>
              </button>
            </div>
          </div>
          <div class="login-actions">
            <button class="btn-primary" type="button" onclick="loginOk()">Đăng nhập</button>
          </div>
        </div>
        <div class="login-meta">
          Tín hiệu <span data-net-signal="light"></span> · đồng bộ hệ thống<br/>
          <a href="#" onclick="toast('Quên mật khẩu → hệ thống xác thực');return false">Quên mật khẩu?</a>
          · bản Gói 1
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="../net-signal.js"></script>
  <script>
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('on');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('on'), 2000);
    }
    function loginOk() {
      toast('Đăng nhập thành công');
      setTimeout(() => toast('→ Home (IA lock · ngoài pack)'), 350);
    }
    function togglePass() {
      const input = document.getElementById('f-pass');
      const use = document.getElementById('eyeUse');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      use.setAttribute('href', show ? '#i-eye-off' : '#i-eye');
    }
  </script>
</body>
</html>
