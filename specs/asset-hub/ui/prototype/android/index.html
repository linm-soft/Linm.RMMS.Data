<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Tài sản · Android</title>
  <style>
    :root {
      --primary: #0C84C0; --deep: #086A9A;
      --teal: #1B8A4A; --indigo: #6750A4; --warn: #E8A317; --gray: #79747E;
      --surface: #F2F2F7; --card: #fff; --muted: #79747E; --label: #1C1B1F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Roboto, "Noto Sans", sans-serif;
      background: #121212; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 412px; height: 915px; background: var(--surface); border-radius: 28px;
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }
    .top-bar {
      display: flex; align-items: center; gap: 4px; padding: 36px 8px 12px;
      background: var(--card); min-height: 88px; box-shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    .icon-btn {
      width: 48px; height: 48px; border: 0; border-radius: 24px; background: transparent;
      color: var(--label); font-size: 22px; cursor: pointer; display: grid; place-items: center;
    }
    .nav-title {
      flex: 1; font-size: 20px; font-weight: 650; color: var(--label); letter-spacing: -0.2px;
    }
    .content { flex: 1; overflow: auto; padding: 12px 0 28px; }
    .wallet-card {
      margin: 0 16px 14px; border-radius: 18px; padding: 16px;
      background: linear-gradient(135deg, #086A9A, #0C84C0); color: #fff;
    }
    .wallet-card .k { font-size: 12px; opacity: .85; font-weight: 700; letter-spacing: .04em; }
    .wallet-card .t { font-size: 20px; font-weight: 800; margin: 6px 0 4px; }
    .wallet-card .m { font-size: 13px; opacity: .92; line-height: 1.35; }
    .section-label {
      font-size: 13px; font-weight: 600; color: var(--muted); margin: 8px 16px 10px;
    }
    .hub-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px 8px;
      align-items: stretch;
    }
    .hub-tile {
      border: 0; background: var(--card); border-radius: 16px; padding: 14px 12px;
      font-family: inherit; cursor: pointer; color: var(--label); text-align: left;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); min-height: 108px;
      display: flex; flex-direction: column; gap: 8px; height: 100%;
    }
    .hub-tile .hi {
      width: 40px; height: 40px; border-radius: 12px; color: #fff;
      display: grid; place-items: center; font-size: 18px; font-weight: 700;
    }
    .hub-tile .t { font-size: 15px; font-weight: 650; }
    .hub-tile .s { font-size: 13px; font-weight: 500; color: var(--muted); line-height: 1.3; min-height: 2.6em; }
    .card-group {
      margin: 0 16px 10px; background: var(--card); border-radius: 14px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer;
      min-height: 56px;
    }
    .row-icon {
      width: 36px; height: 36px; border-radius: 10px; color: #fff;
      display: grid; place-items: center; font-size: 16px; flex-shrink: 0;
    }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; font-weight: 600; color: var(--label); }
    .row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .btn-primary {
      border: 0; border-radius: 18px; background: var(--primary); color: #fff;
      font-family: inherit; font-size: 13px; font-weight: 650; height: 36px; padding: 0 12px;
      cursor: pointer; white-space: nowrap;
    }
    .toast {
      position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%);
      background: #323232; color: #fff; padding: 10px 16px; border-radius: 8px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; z-index: 5;
    }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>
  <div class="phone" id="sc-asset-hub" data-des-id="DES-MOB-ASSET-HUB" data-tab="home">
    <div class="top-bar solid">
      <button class="icon-btn" type="button" title="Trang Chủ" onclick="toast('Trang Chủ')">‹</button>
      <div class="nav-title">Tài sản</div>
    </div>
    <div class="content">
      <div class="wallet-card" data-des-id="DES-MOB-ASSET-WALLET">
        <div class="k">HỒ SƠ TÀI SẢN</div>
        <div class="t">QL.1 · Khu IV</div>
        <div class="m">32 loại KCHT · thông số + checklist sự cố</div>
      </div>
      <div class="hub-grid">
        <button type="button" class="hub-tile" onclick="toast('32 loại tài sản')">
          <div class="hi" style="background:#0C84C0">▣</div>
          <div class="t">32 loại tài sản</div>
          <div class="s">Thông số · checklist sự cố</div>
        </button>
        <button type="button" class="hub-tile" onclick="toast('Xem trên bản đồ')">
          <div class="hi" style="background:#1B8A4A">◎</div>
          <div class="t">Xem trên bản đồ</div>
          <div class="s">Ghim lý trình</div>
        </button>
      </div>
      <div class="section-label">Thu thập</div>
      <div class="hub-grid">
        <button type="button" class="hub-tile" onclick="toast('Thủ công')">
          <div class="hi" style="background:#0C84C0">＋</div>
          <div class="t">Thủ công</div>
          <div class="s">Thêm cột km, biển, cống…</div>
        </button>
        <button type="button" class="hub-tile" onclick="toast('Camera AI')">
          <div class="hi" style="background:#6750A4">📷</div>
          <div class="t">Camera AI</div>
          <div class="s">Chụp → xác nhận vào sổ</div>
        </button>
      </div>
      <div class="section-label">Quản lý</div>
      <div class="hub-grid">
        <button type="button" class="hub-tile" onclick="toast('Danh sách')">
          <div class="hi" style="background:#79747E">▣</div>
          <div class="t">Danh sách</div>
          <div class="s">Tra cứu mã · tuyến · loại</div>
        </button>
        <button type="button" class="hub-tile" onclick="toast('Cập nhật / bớt')">
          <div class="hi" style="background:#E8A317">−</div>
          <div class="t">Cập nhật / bớt</div>
          <div class="s">Sửa hiện trường · bớt khỏi sổ</div>
        </button>
      </div>
      <div class="card-group">
        <div class="row" onclick="toast('Bản đồ tài sản')">
          <div class="row-icon" style="background:#1B8A4A">◎</div>
          <div class="row-body">
            <div class="row-title">Bản đồ tài sản</div>
            <div class="row-sub">Ghim cột km · lớp tuyến</div>
          </div>
        </div>
      </div>
      <div class="section-label" id="sec-ai">Chờ xác nhận AI</div>
      <div class="card-group" id="ai-pending">
        <div class="row" style="cursor:default">
          <div class="row-body">
            <div class="row-title">Ứng viên TS-88 · Cống</div>
            <div class="row-sub">91% · QL.1 Km 1556+000</div>
          </div>
          <button class="btn-primary" type="button" onclick="toast('Xác nhận AI')">Xác nhận</button>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    let t;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('on');
      clearTimeout(t);
      t = setTimeout(() => el.classList.remove('on'), 1400);
    }
  </script>
</body>
</html>
