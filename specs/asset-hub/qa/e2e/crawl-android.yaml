appId: org.linmsoft.rmms
---
# crawl · asset-hub
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "btn-home-login"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-who"
    timeout: 40000

- scrollUntilVisible:
    element:
      id: "tile-asset"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "tile-asset"
- extendedWaitUntil:
    visible:
      id: "sc-asset-hub"
    timeout: 20000

- tapOn:
    id: "tile-types"
- extendedWaitUntil:
    visible:
      id: "sc-asset-types"
    timeout: 8000
- takeScreenshot: CRAWL-types
- tapOn:
    id: "nav-back"
    optional: true

- tapOn:
    id: "tile-map"
- extendedWaitUntil:
    visible:
      id: "sc-gis-map"
    timeout: 8000
- takeScreenshot: CRAWL-map
- tapOn:
    id: "nav-back"
    optional: true

- tapOn:
    id: "tile-collect"
- extendedWaitUntil:
    visible:
      id: "sc-asset-collect"
    timeout: 8000
- takeScreenshot: CRAWL-collect
- tapOn:
    id: "nav-back"
    optional: true

- tapOn:
    id: "tile-ai"
- extendedWaitUntil:
    visible:
      id: "sc-asset-ai"
    timeout: 8000
- takeScreenshot: CRAWL-ai
- tapOn:
    id: "nav-back"
    optional: true

- tapOn:
    id: "tile-list"
- extendedWaitUntil:
    visible:
      id: "sc-asset-list"
    timeout: 8000
- takeScreenshot: CRAWL-list
- tapOn:
    id: "nav-back"
    optional: true

- tapOn:
    id: "tile-adjust"
- extendedWaitUntil:
    visible:
      id: "sc-asset-adjust"
    timeout: 8000
- takeScreenshot: CRAWL-adjust
- tapOn:
    id: "nav-back"
    optional: true

- tapOn:
    id: "row-map"
- extendedWaitUntil:
    visible:
      id: "sc-gis-map"
    timeout: 8000
- takeScreenshot: CRAWL-row-map
- tapOn:
    id: "nav-back"
    optional: true
