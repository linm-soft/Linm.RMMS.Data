appId: org.linmsoft.rmms
---
# cam-view · iOS · guest home → login → tab Tôi → #row-cam → #sc-cam-view
# pattern: cam-patrol (sc-home → btn-home-login · eraseText) · cấm A3 trước login
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- tapOn:
    id: "tab-me"
    optional: true
- tapOn:
    text: "Tôi"
    optional: true
- extendedWaitUntil:
    visible:
      id: "row-cam"
    timeout: 20000
- scroll
- tapOn:
    id: "row-cam"
- extendedWaitUntil:
    visible:
      id: "sc-cam-view"
    timeout: 25000
- assertVisible: "Camera xem"
- assertVisible:
    id: "nav-cam-view"
    optional: true
- takeScreenshot: A3-CORE
