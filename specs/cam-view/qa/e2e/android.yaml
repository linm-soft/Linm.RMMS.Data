appId: org.linmsoft.rmms
---
# cam-view · Android · guest home → login → tab Tôi → #row-cam → #sc-cam-view
# pattern: cam-patrol android (A9 trước Enter · btn-login optional) · Pixel 1080×1920
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- takeScreenshot: A9-LOGIN
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "tab-me"
    optional: true
- tapOn:
    text: "Tôi"
    optional: true
- extendedWaitUntil:
    visible:
      id: "row-cam"
    timeout: 20000
- scroll
- tapOn:
    id: "row-cam"
- extendedWaitUntil:
    visible:
      id: "sc-cam-view"
    timeout: 25000
- assertVisible: "Camera xem"
- assertVisible:
    id: "nav-cam-view"
    optional: true
- takeScreenshot: P6-CORE
- scroll
- takeScreenshot: P6-CORE-2
