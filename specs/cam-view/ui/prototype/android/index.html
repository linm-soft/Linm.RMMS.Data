<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Camera xem · Android</title>
  <style>
    :root {
      --blue: #0C84C0; --green: #34C759; --orange: #FF9500; --danger: #E53935;
      --surface: #F2F2F7; --card: #fff; --label: #1C1C1E; --muted: #8E8E93;
      --sep: rgba(60,60,67,.29); --gray3: #C7C7CC; --jpeg: #1C1C1E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Roboto", "Noto Sans", sans-serif;
      background: #1c1c1e; color: var(--label);
    }
    .phone {
      width: 412px; height: 915px; background: var(--surface); border-radius: 28px;
      overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: flex; flex-direction: column;
    }
    .status-bar { height: 36px; flex-shrink: 0; }
    .top-bar {
      display: flex; align-items: center; gap: 4px; padding: 8px 4px 12px 8px;
      background: var(--card); border-bottom: 1px solid var(--sep);
    }
    .icon-btn {
      width: 40px; height: 40px; border: 0; background: none; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--label);
    }
    .icon-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-title { flex: 1; font-size: 20px; font-weight: 600; }
    .nav-trailing {
      border: 0; background: none; color: var(--blue); font-size: 16px; font-weight: 500;
      cursor: pointer; padding: 8px 12px;
    }
    .content { flex: 1; overflow: auto; padding-bottom: 96px; }
    .jpeg-card {
      margin: 12px 16px; background: var(--jpeg); border-radius: 16px; overflow: hidden;
      min-height: 200px; display: flex; flex-direction: column;
    }
    .jpeg-preview {
      flex: 1; min-height: 160px; display: grid; place-items: center; color: rgba(255,255,255,.55);
    }
    .jpeg-preview svg { width: 48px; height: 48px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .jpeg-preview.has-image {
      background: linear-gradient(145deg, #2c3e50, #1a252f 55%, #0d1117);
      color: rgba(255,255,255,.35);
    }
    .jpeg-meta { padding: 10px 14px 12px; background: rgba(0,0,0,.35); }
    .jpeg-caption { font-size: 16px; font-weight: 600; color: #fff; }
    .jpeg-updated { font-size: 13px; color: rgba(255,255,255,.65); margin-top: 2px; }
    .section-label {
      font-size: 13px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.04em; padding: 12px 16px 6px;
    }
    .card-group {
      margin: 0 16px 8px; background: var(--card); border-radius: 16px; overflow: hidden;
    }
    .row {
      padding: 12px 16px; border-bottom: 1px solid var(--sep);
      display: flex; align-items: center; gap: 8px;
    }
    .row:last-child { border-bottom: 0; }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; font-weight: 600; }
    .row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .empty-state {
      margin: 48px 32px; text-align: center; color: var(--muted);
    }
    .empty-state h2 { font-size: 17px; font-weight: 600; color: var(--label); margin: 0 0 8px; }
    .empty-state p { font-size: 13px; margin: 0; line-height: 1.4; }
    .empty-state svg { width: 40px; height: 40px; margin-bottom: 12px; stroke: var(--muted); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .toast {
      position: absolute; left: 24px; right: 24px; bottom: 120px; z-index: 20;
      background: #323232; color: #fff; font-size: 14px;
      padding: 14px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s;
      pointer-events: none; text-align: center;
    }
    .toast.show { opacity: 1; }
    .nav {
      position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
      background: var(--card); border-top: 1px solid var(--sep);
      display: flex; padding: 8px 0 16px; z-index: 10;
    }
    .nav button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; color: var(--muted); background: none; border: 0; cursor: pointer;
    }
    .nav button.on { color: var(--blue); }
    .nav svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar" aria-hidden="true"></div>

    <!-- #sc-cam-view · DES-MOB-CAM-VIEW · data-tab=me · dual parity · đóng GAP-MOB-CAMVIEW-DUAL-01 -->
    <div class="screen active" id="sc-cam-view" data-des-id="DES-MOB-CAM-VIEW" data-tab="me">
      <div class="top-bar solid">
        <button type="button" class="icon-btn" onclick="goBack()" aria-label="Quay lại">
          <svg class="ic" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
        </button>
        <div class="nav-title">Camera xem</div>
        <button type="button" class="nav-trailing" id="btn-refresh" onclick="onRefresh()">Làm mới</button>
      </div>
      <div class="content" id="content-main">
        <div class="jpeg-card" id="jpeg-card">
          <div class="jpeg-preview has-image" id="jpeg-preview" aria-label="Ảnh JPEG">
            <svg viewBox="0 0 24 24"><use href="#i-video"/></svg>
          </div>
          <div class="jpeg-meta">
            <div class="jpeg-caption" id="jpeg-caption">Ảnh JPEG · iDS-TCM403</div>
            <div class="jpeg-updated" id="jpeg-updated">Cập nhật 08:41</div>
          </div>
        </div>
        <div class="section-label">Sự kiện</div>
        <div class="card-group" id="events-list">
          <div class="row no-icon" id="row-speed">
            <div class="row-body">
              <div class="row-title">Tốc độ 72 km/h</div>
              <div class="row-sub">08:41 · làn 2</div>
            </div>
          </div>
          <div class="row no-icon" id="row-plate">
            <div class="row-body">
              <div class="row-title">Phát hiện biển P.127</div>
              <div class="row-sub">08:36</div>
            </div>
          </div>
        </div>
      </div>
      <div class="content hidden" id="content-empty">
        <div class="empty-state" data-des-id="DES-MOB-CAM-VIEW-EMPTY">
          <svg viewBox="0 0 24 24"><use href="#i-video"/></svg>
          <h2>Chưa có camera Online</h2>
          <p>Không có thiết bị Online · IsActive để xem JPEG. Thử lại khi camera tuyến sẵn sàng.</p>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <nav class="nav" id="tabBar" data-des-id="DES-MOB-TABBAR" aria-label="Shell NavigationBar 5">
      <button type="button" data-tab="home"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg>Trang Chủ</button>
      <button type="button" data-tab="field"><svg viewBox="0 0 24 24"><use href="#i-mappin"/></svg>Tuần đường</button>
      <button type="button" data-tab="incident"><svg viewBox="0 0 24 24"><use href="#i-warning"/></svg>Vấn đề</button>
      <button type="button" data-tab="work"><svg viewBox="0 0 24 24"><use href="#i-wrench"/></svg>Công việc</button>
      <button type="button" class="on" data-tab="me"><svg viewBox="0 0 24 24"><use href="#i-person"/></svg>Tôi</button>
    </nav>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 10.5 21 7v10l-6-3.5"/></symbol>
    <symbol id="i-mappin" viewBox="0 0 24 24"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3.5 22 20H2L12 3.5z"/><path d="M12 10v5"/><path d="M12 17.5h.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5z"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.6 5.6L3 18v3h3l5.9-5.9a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.5-2.5 2.5-2.5z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.8-3.2 4.2-4.5 7-4.5s5.2 1.3 7 4.5"/></symbol>
  </svg>

  <script>
    /** Pack proto: ?empty=1 · ?fail=1 · dual parity 2 event rows · đóng GAP-MOB-CAMVIEW-DUAL-01 */
    const params = new URLSearchParams(location.search);
    const isEmpty = params.has('empty');
    const isFail = params.has('fail');

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function goBack() {
      /* Native: pop NavController → me */
    }

    function onRefresh() {
      if (isEmpty) {
        toast('Chưa có camera Online');
        return;
      }
      if (isFail) {
        toast('Không tải được ảnh');
        return;
      }
      toast('Đã làm mới ảnh');
    }

    function applyState() {
      const main = document.getElementById('content-main');
      const empty = document.getElementById('content-empty');
      const btn = document.getElementById('btn-refresh');
      if (isEmpty) {
        main.classList.add('hidden');
        empty.classList.remove('hidden');
        btn.disabled = true;
        btn.style.opacity = '.4';
        return;
      }
      main.classList.remove('hidden');
      empty.classList.add('hidden');
      if (isFail) {
        document.getElementById('jpeg-preview').classList.remove('has-image');
        document.getElementById('jpeg-caption').textContent = 'Ảnh JPEG · —';
        document.getElementById('jpeg-updated').textContent = 'Cập nhật —';
        setTimeout(() => toast('Không tải được ảnh'), 400);
      }
    }

    applyState();
  </script>
</body>
</html>
