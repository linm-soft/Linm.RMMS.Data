appId: org.linmsoft.rmms
---
# supervise · store P6 ×2 · guest home → login Auth seed → tile Giám sát → #sc-supervise
# live-only (cleanup_mock) · EmptyChrome OK · cấm assert demo names
# cấm hideKeyboard (BACK có thể về launcher) — tap title + Enter
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "tile-supervise"
    optional: true
- tapOn:
    text: "Giám sát"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-supervise"
    timeout: 20000
- assertVisible: "Giám sát tuần đường"
- assertVisible: "Danh sách check in"
- takeScreenshot: P6-CORE
- tapOn:
    id: "btn-sup-filter"
    optional: true
- tapOn:
    text: "Lọc"
    optional: true
- extendedWaitUntil:
    visible: "Lọc tuyến · ngày"
    timeout: 8000
- takeScreenshot: P6-CORE-2
- tapOn:
    text: "Bản đồ"
- extendedWaitUntil:
    visible: "Bản đồ"
    timeout: 8000
- tapOn:
    id: "btn-sup-back"
    optional: true
