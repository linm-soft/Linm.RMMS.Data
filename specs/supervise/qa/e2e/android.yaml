appId: org.linmsoft.rmms
---
# supervise · store P6 ×2 · guest home → login Auth seed → tile Giám sát → #sc-supervise
# edit_page filter sheet live + map sibling push · live-only · EmptyChrome OK
# Android login: IME Enter/Next · cấm eraseText · cấm hideKeyboard
# filter: assert text Áp dụng/Xóa lọc (ModalBottomSheet có thể không expose testTag filter-sheet)
# map: push sc-patrol-map · cấm toast fake
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- inputText: "linm-soft"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 1500
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "btn-login"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- tapOn:
    id: "tile-supervise"
    optional: true
- tapOn:
    text: "Giám sát"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-supervise"
    timeout: 20000
- assertVisible: "Giám sát tuần đường"
- assertVisible: "Danh sách check in"
- takeScreenshot: P6-CORE
- tapOn:
    id: "btn-sup-filter"
    optional: true
- tapOn:
    text: "Lọc"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible: "Áp dụng"
    timeout: 10000
- assertVisible: "Xóa lọc"
- assertVisible: "Tuyến"
- takeScreenshot: P6-CORE-2
- tapOn:
    text: "Huỷ"
    optional: true
- tapOn:
    text: "Hủy"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    text: "Bản đồ"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-map"
    timeout: 15000
- tapOn:
    id: "btn-sup-back"
    optional: true
