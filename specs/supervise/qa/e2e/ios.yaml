appId: org.linmsoft.rmms
---
# supervise · store A11/A9/A3 · guest home → login Auth seed → tile Giám sát → #sc-supervise
# edit_page filter sheet live + map sibling push · live-only · EmptyChrome OK
# iOS LinmTopBar trailing id không expose XCUITest — tap text Lọc / Trang Chủ
# cấm shot login-only cho A3 · cấm mfeStdUrl / start:std · cấm toast fake filter/map
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- tapOn:
    id: "tile-supervise"
    optional: true
- tapOn:
    text: "Giám sát"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-supervise"
    timeout: 20000
- assertVisible: "Giám sát tuần đường"
- assertVisible: "Danh sách check in"
- takeScreenshot: A3-CORE
- tapOn:
    id: "btn-sup-filter"
    optional: true
- tapOn:
    text: "Lọc"
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible: "Áp dụng"
    timeout: 10000
- assertVisible: "Xóa lọc"
- assertVisible: "Tuyến"
- tapOn:
    text: "Huỷ"
    optional: true
- tapOn:
    text: "Hủy"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: "Bản đồ"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-map"
    timeout: 15000
- tapOn:
    id: "btn-sup-back"
    optional: true
- tapOn:
    text: "Trang Chủ"
    optional: true
