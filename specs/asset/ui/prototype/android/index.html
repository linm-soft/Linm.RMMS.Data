<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Danh sách TS · Android</title>
  <style>
    :root {
      --primary: #0C84C0; --indigo: #6750A4; --gray: #79747E;
      --surface: #FFFBFE; --card: #fff; --label: #1C1B1F; --muted: #79747E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Roboto", "Google Sans", system-ui, sans-serif;
      background: #121212; color: var(--label);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 412px; height: 915px; background: var(--surface);
      border-radius: 28px; overflow: hidden; position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: flex; flex-direction: column;
    }
    .top-bar {
      display: flex; align-items: center; min-height: 56px;
      padding: 36px 4px 0; background: var(--surface);
    }
    .icon-btn {
      border: 0; background: transparent; color: var(--label);
      min-width: 48px; min-height: 48px; cursor: pointer;
      display: grid; place-items: center;
    }
    .nav-title {
      flex: 1; text-align: center; font-size: 20px; font-weight: 650;
      padding-right: 48px;
    }
    .search {
      margin: 8px 16px 12px; background: rgba(121,116,126,.12); border-radius: 28px;
      padding: 12px 16px; display: flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: 13px;
    }
    .search span { color: #938F99; flex: 1; }
    .content { flex: 1; overflow: auto; padding: 0 0 28px; }
    .card-group {
      margin: 0 16px 16px; background: var(--card); border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .row {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      border-bottom: 1px solid rgba(0,0,0,.08); cursor: pointer; min-height: 56px;
    }
    .row:last-child { border-bottom: 0; }
    .row-icon {
      width: 36px; height: 36px; border-radius: 10px; color: #fff;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; font-weight: 600; }
    .row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .ic {
      width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em;
      fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
    }
    .ic-md { font-size: 20px; }
    .ic-sm { font-size: 16px; }
    .sprites { position: absolute; width: 0; height: 0; overflow: hidden; }
    .toast {
      position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(16px);
      background: #313033; color: #fff; font-size: 14px; font-weight: 500;
      padding: 12px 16px; border-radius: 8px; z-index: 40; opacity: 0; pointer-events: none;
      max-width: calc(100% - 32px); text-align: center; transition: .25s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .gesture {
      position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: 108px; height: 4px; background: #1C1B1F; border-radius: 2px; opacity: .28;
    }
    .note {
      position: absolute; top: 10px; left: 0; right: 0; text-align: center;
      color: #888; font-size: 11px; pointer-events: none;
    }
  </style>
</head>
<body>
  <svg class="sprites" aria-hidden="true">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16.5 16.5 21 21"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 3 3 8.5v7L12 21l9-5.5v-7L12 3z"/><path d="M3 8.5 12 14l9-5.5M12 14v7"/></symbol>
  </svg>

  <div class="note">DES-MOB-ASSET-LIST · Android 412×915 · asset</div>
  <div class="phone">
    <div id="sc-asset-list" data-des-id="DES-MOB-ASSET-LIST">
      <div class="top-bar" data-des-id="DES-MOB-ASSET-LIST-NAV">
        <button class="icon-btn" type="button" id="nav-back" onclick="toast('Quay Tài sản')" aria-label="Tài sản">
          <svg class="ic ic-md" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
        </button>
        <div class="nav-title" id="nav-title">Danh sách</div>
      </div>
      <div class="search" id="search-asset" data-des-id="DES-MOB-ASSET-LIST-SEARCH">
        <svg class="ic ic-md" viewBox="0 0 24 24"><use href="#i-search"/></svg>
        <span>Tìm mã TS, tuyến, loại…</span>
      </div>
      <div class="content" data-des-id="DES-MOB-ASSET-LIST-ROWS">
        <div class="card-group">
          <div class="row" id="row-asset-TS-20260810-014" onclick="toast('Chi tiết tài sản')">
            <div class="row-icon" style="background:var(--indigo)">
              <svg class="ic ic-md" viewBox="0 0 24 24"><use href="#i-cube"/></svg>
            </div>
            <div class="row-body">
              <div class="row-title">TS-20260810-014 · Cống ngang</div>
              <div class="row-sub">QL.1 · Km 1556+000 · Cống</div>
            </div>
          </div>
          <div class="row" id="row-asset-TS-20260809-088" onclick="toast('Chi tiết tài sản')">
            <div class="row-icon" style="background:var(--gray)">
              <svg class="ic ic-md" viewBox="0 0 24 24"><use href="#i-cube"/></svg>
            </div>
            <div class="row-body">
              <div class="row-title">TS-20260809-088 · Biển P.127</div>
              <div class="row-sub">HCM · Biển báo</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="gesture"></div>
  </div>
  <script>
    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
    }
  </script>
</body>
</html>
