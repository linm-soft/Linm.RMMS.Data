appId: org.linmsoft.rmms
---
# asset · store A11/A9/A3 · cold start guest #sc-home → login → #tile-asset → hub → #tile-list → #sc-asset-list
# cấm shot login-only / hub-only cho A3 · cấm sibling detail · pattern mnt-list/incident-list
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "tile-asset"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "tile-asset"
- extendedWaitUntil:
    visible:
      id: "sc-asset-hub"
    timeout: 20000
- tapOn:
    id: "tile-list"
- extendedWaitUntil:
    visible:
      id: "sc-asset-list"
    timeout: 25000
- assertVisible:
    id: "asset-list-search"
- assertVisible:
    id: "row-asset-0"
- assertVisible: "Danh sách"
- takeScreenshot: A3-CORE
- assertVisible:
    id: "sc-asset-list"
