<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Trang Chủ · iOS</title>
  <style>
    :root {
      --blue: #0C84C0; --deep: #086A9A; --sky: #2A9AD4;
      --success: #3CB448; --warn: #FCB43C; --danger: #F03C30;
      --surface: #F2F2F7; --card: #fff; --muted: #8E8E93; --label: #1C1C1E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #1c1c1e; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 390px; height: 844px; background: var(--surface); border-radius: 44px;
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }
    .content { flex: 1; overflow: auto; padding: 0; display: flex; flex-direction: column; }
    .vn-hero {
      margin: 0 0 14px; padding: 54px 16px 18px;
      background: linear-gradient(165deg, #086A9A 0%, #0C84C0 55%, #2A9AD4 100%);
      color: #fff; border-radius: 0 0 22px 22px;
    }
    .vn-hero-tools { display: flex; justify-content: space-between; margin-bottom: 10px; position: relative; }
    .home-brand {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 36px; height: 36px; border-radius: 8px; background: #fff;
      display: grid; place-items: center; font: 800 10px/1 inherit; color: #086A9A;
      pointer-events: none;
    }
    .hero-ico {
      width: 44px; height: 44px; border: 0; border-radius: 22px; cursor: pointer;
      background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center;
      position: relative; font-size: 18px;
    }
    .role {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600;
      background: rgba(0,0,0,.18); border-radius: 999px; padding: 4px 10px;
    }
    .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
    .bars i { display: block; width: 3px; background: #fff; border-radius: 1px; opacity: .95; }
    .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 7px; }
    .bars i:nth-child(3) { height: 10px; } .bars i:nth-child(4) { height: 12px; }
    .who { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin: 8px 0 12px; }
    .btn-home-login {
      display: block; width: 100%; border: 0; border-radius: 14px; padding: 12px 14px;
      text-align: left; cursor: pointer; background: #fff; color: #086A9A;
      font: 700 15px/1.25 inherit; box-shadow: 0 4px 12px rgba(0,0,0,.12); margin-bottom: 12px;
    }
    .btn-home-login .s { display: block; font-size: 13px; font-weight: 500; color: #5a6a80; margin-top: 4px; }
    .vn-quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .vn-quick button {
      border: 0; border-radius: 14px; padding: 14px 12px; text-align: left; cursor: pointer;
      background: linear-gradient(180deg, #fff8e8, #fff); color: #086A9A;
      font-family: inherit; font-weight: 700; font-size: 14px; box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }
    .vn-quick .s { display: block; font-size: 13px; font-weight: 500; color: #5a6a80; margin-top: 4px; }
    .section-label {
      font-size: 13px; font-weight: 600; color: var(--muted); margin: 4px 16px 10px;
    }
    .home-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 0 16px 12px;
    }
    .home-tile {
      border: 0; background: var(--card); border-radius: 16px; min-height: 96px;
      padding: 12px 8px; font-family: inherit; cursor: pointer; color: var(--label);
      box-shadow: 0 1px 4px rgba(0,0,0,.05); display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .home-tile .hi {
      width: 44px; height: 44px; border-radius: 12px; color: #fff;
      display: grid; place-items: center; font-size: 18px; font-weight: 700;
    }
    .home-tile .t { font-size: 15px; font-weight: 650; letter-spacing: -0.3px; text-align: center; }
    .wallet-card {
      margin: 0 16px 16px; border-radius: 18px; padding: 16px;
      background: linear-gradient(135deg, #086A9A, #0C84C0); color: #fff; cursor: pointer;
    }
    .wallet-card .k { font-size: 12px; opacity: .85; font-weight: 700; letter-spacing: .04em; }
    .wallet-card .t { font-size: 20px; font-weight: 800; margin: 6px 0 4px; }
    .wallet-card .m { font-size: 13px; opacity: .92; line-height: 1.35; }
    .guest-dock { margin-top: auto; padding: 8px 16px 28px; }
    .guest-dock .btn-home-login { width: 100%; margin-bottom: 0; }
    .guest-dock .privacy-link { padding: 8px 0 12px; }
    .toast {
      position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: rgba(28,28,30,.92); color: #fff; padding: 10px 16px; border-radius: 12px;
      font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap; z-index: 5;
    }
    .toast.on { opacity: 1; }
    .guest-row {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
      margin: 0 16px 10px; padding: 14px; border: 0; width: calc(100% - 32px);
      background: var(--card); border-radius: 16px; text-align: left; cursor: pointer;
      font-family: inherit; color: var(--label); box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .guest-row .t { font-size: 15px; font-weight: 650; }
    .guest-row .s { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
    .guest-row .ch { color: var(--muted); font-size: 16px; }
    .privacy-link {
      display: block; width: 100%; border: 0; background: none; cursor: pointer;
      color: var(--blue); font: 500 13px inherit; text-decoration: underline; padding: 8px 16px 12px;
    }
    .overlay {
      position: absolute; inset: 0; background: var(--surface); z-index: 8;
      display: none; flex-direction: column;
    }
    .overlay.on { display: flex; }
    .ov-bar { display: flex; align-items: center; padding: 16px 16px 8px; }
    .ov-bar button { border: 0; background: none; color: var(--blue); font: 500 13px inherit; cursor: pointer; }
    .ov-bar h1 { flex: 1; text-align: center; font-size: 15px; margin: 0; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; }
    .chips button {
      border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer;
      background: var(--card); color: var(--label); font: 600 13px inherit; white-space: nowrap;
    }
    .chips button.on { background: var(--blue); color: #fff; }
    .faq-search {
      margin: 0 16px 8px; height: 44px; border-radius: 999px; background: var(--card);
      display: flex; align-items: center; padding: 0 14px;
    }
    .faq-search input { flex: 1; border: 0; outline: none; font: 15px inherit; background: transparent; }
    .faq-list { flex: 1; overflow: auto; background: var(--card); }
    .faq-row { width: 100%; border: 0; border-bottom: 1px solid var(--surface); background: none; text-align: left; padding: 14px 16px; cursor: pointer; font-family: inherit; }
    .faq-row .q { font-size: 15px; font-weight: 650; color: var(--label); }
    .faq-row .a { display: none; font-size: 13px; color: var(--muted); margin-top: 8px; }
    .faq-row.open .a { display: block; }
    .privacy-body { padding: 16px; font-size: 15px; line-height: 1.45; color: var(--label); overflow: auto; }
  </style>
</head>
<body>
  <div class="phone" id="sc-home" data-des-id="DES-MOB-HOME" data-tab="home">
    <div class="content">
      <div class="vn-hero" data-des-id="DES-MOB-HOME-HELLO">
        <div class="vn-hero-tools">
          <button class="hero-ico" type="button" title="Hồ sơ" onclick="toast('Hồ sơ → tab Tôi')">👤</button>
          <span class="home-brand" id="home-brand">RMMS</span>
          <button class="hero-ico" type="button" title="Thông báo" onclick="toast('Thông báo')">🔔</button>
        </div>
        <!-- Demo SSOT: role+signal. Live: role ẩn · signal OS path · badge notifyCount=0 ẩn -->
        <span class="role" onclick="toast('Đã làm mới')">
          Khu QLĐB IV
          <span class="bars" aria-label="Tín hiệu Tốt"><i></i><i></i><i></i><i></i></span>
          Tốt
        </span>
        <div class="who" id="home-who">Khách</div>
      </div>
      <div class="section-label" id="section-guest">Hỗ trợ người dân</div>
      <button class="guest-row" id="btn-home-faq" type="button" onclick="openOv('sc-faq')">
        <span><span class="t">Câu hỏi thường gặp</span><span class="s">Tài liệu · thủ tục · cấp phép</span></span>
        <span class="ch">›</span>
      </button>
      <div class="guest-dock">
        <button class="btn-home-login" id="btn-home-login" type="button" onclick="toast('Đăng nhập')">
          Đăng nhập<span class="s">Dành cho cán bộ</span>
        </button>
        <button class="privacy-link" id="btn-home-privacy" type="button" onclick="openOv('sc-privacy')">Chính sách quyền riêng tư</button>
      </div>
      <!-- GAP-F-HOME-03: .home-foot Gói — cấm ship · không vẽ -->
    </div>
    <div class="overlay" id="sc-faq" data-des-id="DES-MOB-HOME-FAQ">
      <div class="ov-bar">
        <button type="button" id="btn-faq-back" onclick="closeOv()">Về Trang Chủ</button>
        <h1>Câu hỏi thường gặp</h1>
      </div>
      <div class="chips">
        <button type="button" class="on" id="chip-faq-docs">Tài liệu</button>
        <button type="button" id="chip-faq-proc">Thủ tục</button>
        <button type="button" id="chip-faq-permit">Cấp phép</button>
        <button type="button" id="chip-faq-app">Ứng dụng</button>
      </div>
      <div class="faq-search"><input id="f-faq-search" placeholder="Tìm kiếm câu hỏi" /></div>
      <div class="faq-list">
        <button class="faq-row" type="button" onclick="this.classList.toggle('open')"><div class="q">Open data Bộ GTVT là gì?</div><div class="a">Bộ tài liệu công khai về cấp phép và thủ tục hành chính đường bộ. Người dân xem và tải miễn phí, không cần đăng nhập.</div></button>
        <button class="faq-row" type="button" onclick="this.classList.toggle('open')"><div class="q">Tài liệu thủ tục có mất phí không?</div><div class="a">Không. Tài liệu open data trong danh mục này dùng miễn phí.</div></button>
      </div>
    </div>
    <div class="overlay" id="sc-privacy" data-des-id="DES-MOB-HOME-PRIVACY">
      <div class="ov-bar">
        <button type="button" id="btn-privacy-back" onclick="closeOv()">Về Trang Chủ</button>
        <h1>Chính sách quyền riêng tư</h1>
      </div>
      <div class="privacy-body" id="privacy-body">Khi bạn là Khách, ứng dụng chỉ hiển thị thông tin công khai (FAQ, tài liệu thủ tục). Không gửi hồ sơ cán bộ, không lấy vị trí lúc mở app.</div>
    </div>
    <!-- GAP-MOB-EDIT-GUEST-TAB: guest ẩn LinmTabBar · staff mới hiện DES-MOB-TABBAR -->
    <div class="toast" id="toast"></div>
  </div>
  <script>
    let t;
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('on');
      clearTimeout(t);
      t = setTimeout(() => el.classList.remove('on'), 1400);
    }
    function openOv(id) { document.getElementById(id).classList.add('on'); }
    function closeOv() {
      document.getElementById('sc-faq').classList.remove('on');
      document.getElementById('sc-privacy').classList.remove('on');
    }
  </script>
</body>
</html>
