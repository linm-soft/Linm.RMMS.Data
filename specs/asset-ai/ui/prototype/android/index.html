<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Camera AI · Android</title>
  <style>
    :root {
      --blue: #0C84C0; --green: #34C759; --orange: #FF9500; --danger: #E53935;
      --surface: #F2F2F7; --card: #fff; --label: #1C1C1E; --muted: #8E8E93;
      --sep: rgba(60,60,67,.29); --gray3: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Roboto", "Noto Sans", sans-serif;
      background: #1c1c1e; color: var(--label);
    }
    .phone {
      width: 412px; height: 915px; background: var(--surface); border-radius: 28px;
      overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: flex; flex-direction: column;
    }
    .status-bar { height: 36px; flex-shrink: 0; }
    .top-bar {
      display: flex; align-items: center; gap: 4px; padding: 8px 8px 12px;
      background: var(--card); border-bottom: 1px solid var(--sep);
    }
    .icon-btn {
      width: 40px; height: 40px; border: 0; background: none; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--label);
    }
    .icon-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-title { flex: 1; font-size: 20px; font-weight: 600; }
    .content { flex: 1; overflow: auto; padding-bottom: 96px; padding-top: 8px; }
    .banner {
      margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px;
      background: #FFF3E0; color: #9A5B00; font-size: 13px; display: none;
    }
    .banner.show { display: block; }
    .section-label {
      margin: 4px 32px 6px; font-size: 13px; color: var(--muted); font-weight: 400;
    }
    .photo-row {
      margin: 0 16px 8px; background: var(--card); border-radius: 16px;
      padding: 12px; display: flex; gap: 10px; align-items: center;
    }
    .photo-slot {
      width: 72px; height: 72px; border-radius: 12px; background: var(--surface);
      border: 1px dashed var(--gray3); display: flex; align-items: center; justify-content: center;
      overflow: hidden; color: var(--muted); font-size: 11px;
    }
    .photo-slot.filled { border-style: solid; background: #E8F4FA; color: var(--blue); font-size: 12px; font-weight: 600; }
    .cam-btn {
      width: 48px; height: 48px; border-radius: 24px; border: 0; background: var(--blue);
      color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .cam-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .card-group {
      margin: 0 16px 8px; background: var(--card); border-radius: 16px; overflow: hidden;
    }
    .row {
      padding: 12px 16px; border-bottom: 1px solid var(--sep);
      display: flex; align-items: center; gap: 8px;
    }
    .row:last-child { border-bottom: 0; }
    .row-body { flex: 1; min-width: 0; }
    .row-sub { font-size: 13px; color: var(--muted); }
    .row-title { font-size: 16px; font-weight: 600; margin-top: 2px; }
    .cta-col { padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 8px; }
    .btn {
      width: 100%; border: 0; border-radius: 28px; padding: 14px 16px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-secondary { background: var(--card); color: var(--label); }
    .toast {
      position: absolute; left: 24px; right: 24px; bottom: 110px; z-index: 20;
      background: #323232; color: #fff; font-size: 14px;
      padding: 12px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s;
      pointer-events: none; text-align: center;
    }
    .toast.show { opacity: 1; }
    .nav {
      position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
      background: var(--card); border-top: 1px solid var(--sep);
      display: flex; padding: 8px 0 16px; z-index: 10;
    }
    .nav .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; color: var(--muted); background: none; border: 0; cursor: pointer;
    }
    .nav .tab.on { color: var(--blue); }
    .nav .tab svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar" aria-hidden="true"></div>

    <!-- #sc-asset-ai · DES-MOB-ASSET-AI · data-tab=home · SSOT control-hint (hash skip) · SCORE-01 show % -->
    <div class="screen active" id="sc-asset-ai" data-des-id="DES-MOB-ASSET-AI" data-tab="home">
      <div class="top-bar solid">
        <button type="button" class="icon-btn" onclick="goBack()" aria-label="Quay lại">
          <svg class="ic" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
        </button>
        <div class="nav-title">Camera AI</div>
      </div>
      <div class="content">
        <div class="banner" id="banner-gpsdeny" role="status">Định vị bị tắt — bật GPS để gửi nhận diện</div>
        <div class="section-label">Chụp tài sản / thiết bị mới</div>
        <div class="photo-row">
          <div class="photo-slot filled" id="photo-slot" aria-label="Ảnh đã chụp">Ảnh</div>
          <button type="button" class="cam-btn" id="addPhoto" onclick="onCapture()" aria-label="Chụp ảnh">
            <svg viewBox="0 0 24 24"><use href="#i-camera"/></svg>
          </button>
        </div>
        <div class="card-group">
          <div class="row" id="row-pos">
            <div class="row-body">
              <div class="row-sub">Vị trí đã chốt</div>
              <div class="row-title" id="pos-value">QL.1 · Km 1556+000</div>
            </div>
          </div>
          <div class="row" id="row-class">
            <div class="row-body">
              <div class="row-sub">Loại đề xuất</div>
              <div class="row-title" id="class-value">Cống</div>
            </div>
          </div>
          <div class="row" id="row-score">
            <div class="row-body">
              <div class="row-sub">Độ tin cậy</div>
              <div class="row-title" id="score-value">91%</div>
            </div>
          </div>
        </div>
        <div class="cta-col">
          <button type="button" class="btn btn-primary" id="btn-send" onclick="onSend()">Gửi nhận diện</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel" onclick="onCancel()">Hủy</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <nav class="nav" id="tabBar" data-des-id="DES-MOB-TABBAR" aria-label="Shell Nav 5">
      <button type="button" class="tab on" data-tab="home"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg>Trang Chủ</button>
      <button type="button" class="tab" data-tab="field"><svg viewBox="0 0 24 24"><use href="#i-mappin"/></svg>Tuần đường</button>
      <button type="button" class="tab" data-tab="incident"><svg viewBox="0 0 24 24"><use href="#i-warning"/></svg>Vấn đề</button>
      <button type="button" class="tab" data-tab="work"><svg viewBox="0 0 24 24"><use href="#i-wrench"/></svg>Công việc</button>
      <button type="button" class="tab" data-tab="me"><svg viewBox="0 0 24 24"><use href="#i-person"/></svg>Tôi</button>
    </nav>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4V8z"/><circle cx="12" cy="13.5" r="3.2"/></symbol>
    <symbol id="i-mappin" viewBox="0 0 24 24"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3.5 22 20H2L12 3.5z"/><path d="M12 10v5"/><path d="M12 17.5h.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5z"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.6 5.6L3 18v3h3l5.9-5.9a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.5-2.5 2.5-2.5z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.8-3.2 4.2-4.5 7-4.5s5.2 1.3 7 4.5"/></symbol>
  </svg>

  <script>
    /** Pack proto: ?gpsdeny=1 → banner + chặn Gửi · SSOT #sc-asset-ai · hash skip · SCORE P1 */
    const gpsDeny = location.search.includes('gpsdeny=1');
    let hasPhoto = true;
    const btnSend = document.getElementById('btn-send');
    const photoSlot = document.getElementById('photo-slot');

    if (gpsDeny) {
      document.getElementById('banner-gpsdeny').classList.add('show');
      document.getElementById('pos-value').textContent = '—';
      btnSend.disabled = true;
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }
    function syncPrimary() {
      if (gpsDeny) { btnSend.disabled = true; return; }
      btnSend.disabled = !hasPhoto;
    }
    function onCapture() {
      hasPhoto = true;
      photoSlot.classList.add('filled');
      photoSlot.textContent = 'Ảnh';
      syncPrimary();
      toast('Đã chụp · sẵn sàng upload');
    }
    function onSend() {
      if (gpsDeny) {
        toast('Cần bật định vị để gửi nhận diện');
        return;
      }
      if (!hasPhoto) {
        toast('Cần ảnh tài sản trước khi gửi');
        return;
      }
      toast('Đã gửi nhận diện · AC-20260901-0001');
    }
    function onCancel() {
      toast('← Tài sản (asset-hub)');
    }
    function goBack() {
      toast('← Tài sản (asset-hub)');
    }
    syncPrimary();
  </script>
</body>
</html>
