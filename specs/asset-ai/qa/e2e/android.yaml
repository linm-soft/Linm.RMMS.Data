appId: org.linmsoft.rmms
---
# asset-ai · store P6 ×2 · guest → login → hub → tile-ai → #sc-asset-ai (Pixel 1080×1920)
# P6-CORE = photo + rows fold · P6-CORE-2 = CTA fold · cấm hideKeyboard · MEDIA/camera DEFER
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "tile-asset"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "tile-asset"
- extendedWaitUntil:
    visible:
      id: "sc-asset-hub"
    timeout: 20000
- assertVisible:
    id: "tile-ai"
- tapOn:
    id: "tile-ai"
- extendedWaitUntil:
    visible:
      id: "sc-asset-ai"
    timeout: 25000
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "ONLY THIS TIME"
    optional: true
- tapOn:
    id: "btn-gps-deny-later"
    optional: true
- assertVisible: "Camera AI"
- assertVisible:
    id: "photo-row"
- assertVisible:
    id: "i-camera"
- assertVisible:
    id: "row-pos"
- assertVisible:
    id: "row-class"
- takeScreenshot: P6-CORE
- scrollUntilVisible:
    element:
      id: "btn-send"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "row-score"
- assertVisible:
    id: "btn-send"
- assertVisible:
    id: "btn-cancel"
- takeScreenshot: P6-CORE-2
- assertVisible:
    id: "sc-asset-ai"
