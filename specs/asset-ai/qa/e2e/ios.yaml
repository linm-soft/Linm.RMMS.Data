appId: org.linmsoft.rmms
---
# asset-ai · store A11/A9/A3 · guest → login → hub → tile-ai → #sc-asset-ai
# slug only · cấm sibling collect/adjust/det-hitl Confirm · cấm A3 trước login · cấm mfeStdUrl
# MEDIA/camera live DEFER — assert chrome + rows + CTA · không bắt buộc chụp
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "tile-asset"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "tile-asset"
- extendedWaitUntil:
    visible:
      id: "sc-asset-hub"
    timeout: 20000
- assertVisible:
    id: "tile-ai"
- tapOn:
    id: "tile-ai"
- extendedWaitUntil:
    visible:
      id: "sc-asset-ai"
    timeout: 25000
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Cho phép"
    optional: true
- tapOn:
    id: "btn-gps-deny-later"
    optional: true
- assertVisible: "Camera AI"
- assertVisible:
    id: "photo-row"
- assertVisible:
    id: "i-camera"
- assertVisible:
    id: "row-pos"
- assertVisible:
    id: "row-class"
- assertVisible:
    id: "row-score"
- assertVisible:
    id: "btn-send"
- assertVisible:
    id: "btn-cancel"
- takeScreenshot: A3-CORE
- assertVisible:
    id: "sc-asset-ai"
