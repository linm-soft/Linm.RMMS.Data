appId: org.linmsoft.rmms
---
# incident-detail · store A11/A9/A3 · guest → login → list (live seed) → #sc-incident-detail
# Seed BFF X-Company-Id:LINM · VD-20260829-0001 id 4b0d2722-e072-4775-8976-ec06952fc804
# Action btn a11y often merged under card — try id then point (detail = 3rd icon)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "tile-incident"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "tile-incident"
    optional: true
- tapOn:
    id: "tab-incident"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-incident-list"
    timeout: 25000
- assertVisible: "Quản lý vấn đề"
- assertVisible: "Nứt mặt đường"
- tapOn:
    id: "btn-inc-detail-4b0d2722-e072-4775-8976-ec06952fc804"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "sc-incident-detail"
    commands:
      - tapOn:
          point: "61%,54%"
- extendedWaitUntil:
    visible:
      id: "sc-incident-detail"
    timeout: 25000
- extendedWaitUntil:
    visible: "Mã"
    timeout: 15000
- assertVisible: "Mã"
- assertVisible: "Loại"
- assertVisible: "Vị trí ghim tự động"
- assertVisible: "Định vị"
- assertVisible: "Giao việc xử lý"
- assertVisible: "Xem trên bản đồ"
- assertVisible: "Đóng sự cố"
- assertVisible:
    id: "btn-assign"
    optional: true
- assertVisible:
    id: "btn-map"
    optional: true
- assertVisible:
    id: "btn-close"
    optional: true
- takeScreenshot: A3-CORE
- tapOn:
    id: "btn-close"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
