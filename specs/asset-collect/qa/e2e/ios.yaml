appId: org.linmsoft.rmms
---
# asset-collect · store A11/A9/A3 · guest → login → hub → tile-collect → #sc-asset-collect
# cấm shot login/hub-only cho A3 · cấm sibling AI/list/detail · MEDIA local DEFER
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "tile-asset"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "tile-asset"
- extendedWaitUntil:
    visible:
      id: "sc-asset-hub"
    timeout: 20000
- assertVisible:
    id: "tile-collect"
- tapOn:
    id: "tile-collect"
- extendedWaitUntil:
    visible:
      id: "sc-asset-collect"
    timeout: 25000
- assertVisible: "Thu thập thủ công"
- assertVisible:
    id: "select-type"
- assertVisible:
    id: "input-name"
- assertVisible:
    id: "select-status"
- assertVisible:
    id: "photo-row"
- assertVisible:
    id: "btn-add-asset"
- assertVisible:
    id: "i-camera"
# Fill name (Type/Status/GPS/Route từ init+GPS live — cấm invent Code)
- tapOn:
    id: "input-name"
- eraseText
- inputText: "E2E cột km QA"
- tapOn:
    text: "Thu thập thủ công"
    optional: true
- takeScreenshot: A3-CORE
- assertVisible:
    id: "sc-asset-collect"
