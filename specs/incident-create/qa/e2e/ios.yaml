    optional: true
- tapOn:
    id: "ak32-BRIDGE"
    optional: true
- tapOn:
    text: "Cầu"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "While Using the App"
    optional: true
- tapOn:
    text: "Allow While Using App"
    optional: true
- extendedWaitUntil:
