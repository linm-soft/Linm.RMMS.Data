appId: org.linmsoft.rmms
---
# crawl · incident-create
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "btn-home-login"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-who"
    timeout: 40000

- tapOn:
    id: "quick-incident"
    optional: true
- tapOn:
    id: "tab-incident"
    optional: true
- tapOn:
    text: "Vấn đề"
    optional: true
- tapOn:
    point: "50%,96%"
    optional: true
- tapOn:
    id: "fab-inc-create"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-inc-pick"
    timeout: 20000
