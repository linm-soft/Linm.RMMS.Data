      id: "sc-inc-pick"
    timeout: 25000
- assertVisible:
    id: "banner-pick"
    optional: true
- tapOn:
    id: "ak32-CULVERT_X"
    optional: true
- tapOn:
    text: "Cống thoát nước ngang"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "ONLY THIS TIME"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-inc-form"
    timeout: 25000
- assertVisible: "Ghi sự cố"
- assertVisible:
    id: "kind-pills"
    optional: true
- assertVisible:
    id: "photo-row"
    optional: true
- takeScreenshot: P6-CORE
- scroll
- scroll
- assertVisible:
    id: "btn-create"
    optional: true
- assertVisible:
    id: "btn-draft"
    optional: true
- takeScreenshot: P6-CORE-2
