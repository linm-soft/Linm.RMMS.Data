<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Công tác nghiệm thu · iOS</title>
  <style>
    :root {
      --blue: #0C84C0; --green: #34C759; --orange: #FF9500; --danger: #FF3B30;
      --surface: #F2F2F7; --card: #fff; --label: #1C1C1E; --muted: #8E8E93;
      --sep: rgba(60,60,67,.29); --tab: #F9F9F9; --gray3: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #1c1c1e; color: var(--label);
    }
    .phone {
      width: 390px; height: 844px; background: var(--surface); border-radius: 44px;
      overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: flex; flex-direction: column;
    }
    .status-bar { height: 54px; flex-shrink: 0; }
    .nav-bar {
      display: flex; align-items: center; padding: 0 8px 8px; min-height: 44px;
      background: rgba(242,242,247,.92); border-bottom: 1px solid var(--sep);
    }
    .nav-btn {
      display: flex; align-items: center; gap: 2px; border: 0; background: none;
      color: var(--blue); font-size: 17px; font-weight: 400; cursor: pointer; padding: 8px;
      white-space: nowrap;
    }
    .nav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }
    .nav-trail {
      border: 0; background: none; color: var(--blue); font-size: 17px; font-weight: 400;
      cursor: pointer; padding: 8px; min-width: 48px; text-align: right;
    }
    .content { flex: 1; overflow: auto; padding-bottom: 96px; }
    .search-wrap {
      margin: 8px 16px 12px; display: flex; align-items: center; gap: 8px;
      background: var(--card); border-radius: 10px; padding: 10px 12px;
    }
    .search-wrap svg {
      width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .search-wrap input {
      flex: 1; border: 0; outline: 0; background: transparent; font-size: 16px;
      font-family: inherit; color: var(--label);
    }
    .search-wrap input::placeholder { color: var(--muted); }
    .list { margin: 0 16px; background: var(--card); border-radius: 12px; overflow: hidden; }
    .list-row {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      border-bottom: 1px solid var(--sep); cursor: pointer; background: none; width: 100%;
      text-align: left; font-family: inherit; color: inherit;
    }
    .list-row:last-child { border-bottom: 0; }
    .row-ico {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
      background: rgba(52,199,89,.14); color: var(--green);
    }
    .row-ico.blue { background: rgba(12,132,192,.14); color: var(--blue); }
    .row-ico svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .row-body { flex: 1; min-width: 0; }
    .row-title { font-size: 16px; font-weight: 600; }
    .row-sub { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      font-size: 13px; font-weight: 650; padding: 4px 8px; border-radius: 8px; flex-shrink: 0;
    }
    .badge.blue { background: rgba(12,132,192,.15); color: var(--blue); }
    .badge.green { background: rgba(52,199,89,.15); color: #1f8f3a; }
    .badge.info { background: rgba(12,132,192,.12); color: #086A9A; }
    .badge.gray { background: rgba(142,142,147,.18); color: #636366; }
    .chev { width: 16px; height: 16px; stroke: var(--gray3); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .empty {
      margin: 48px 24px; text-align: center; color: var(--muted); font-size: 16px; display: none;
    }
    .empty.show { display: block; }
    .empty p { font-size: 13px; margin: 8px 0 0; }
    .toast {
      position: absolute; left: 24px; right: 24px; bottom: 110px; z-index: 20;
      background: rgba(28,28,30,.92); color: #fff; font-size: 14px;
      padding: 12px 14px; border-radius: 12px; opacity: 0; transition: opacity .2s;
      pointer-events: none; text-align: center;
    }
    .toast.show { opacity: 1; }
    .tabbar {
      position: absolute; left: 0; right: 0; bottom: 0; height: 83px;
      background: rgba(249,249,249,.94); border-top: 1px solid var(--sep);
      display: flex; padding: 6px 0 22px; z-index: 10;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 10px; color: var(--muted); background: none; border: 0; cursor: pointer;
    }
    .tab.on { color: var(--blue); }
    .tab svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar" aria-hidden="true"></div>

    <!-- #sc-nghiem-thu · DES-MOB-NGHIEM-THU · data-tab=field · SSOT control-hint (hash skip) -->
    <div class="screen active" id="sc-nghiem-thu" data-des-id="DES-MOB-NGHIEM-THU" data-tab="field">
      <div class="nav-bar">
        <button type="button" class="nav-btn" onclick="goBack()" aria-label="Tuần đường">
          <svg class="ic ic-sm" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg> Tuần đường
        </button>
        <div class="nav-title">Công tác nghiệm thu</div>
        <button type="button" class="nav-trail" id="nav-create" onclick="goCreate()">Tạo</button>
      </div>
      <div class="content">
        <div class="search-wrap" data-des-id="DES-MOB-NT-SEARCH">
          <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
          <input type="search" id="search" placeholder="Tìm mẫu nghiệm thu…" aria-label="Tìm mẫu nghiệm thu" autocomplete="off" />
        </div>
        <div class="list" id="list" role="list"></div>
        <div class="empty" id="empty" role="status">
          Chưa có phiếu nghiệm thu
          <p>Nhấn Tạo để lập phiếu mới</p>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <nav class="tabbar" id="tabBar" data-des-id="DES-MOB-TABBAR" aria-label="Shell Tab 5">
      <button type="button" class="tab" data-tab="home"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg>Trang Chủ</button>
      <button type="button" class="tab on" data-tab="field"><svg viewBox="0 0 24 24"><use href="#i-mappin"/></svg>Tuần đường</button>
      <button type="button" class="tab" data-tab="incident"><svg viewBox="0 0 24 24"><use href="#i-warning"/></svg>Vấn đề</button>
      <button type="button" class="tab" data-tab="work"><svg viewBox="0 0 24 24"><use href="#i-wrench"/></svg>Công việc</button>
      <button type="button" class="tab" data-tab="me"><svg viewBox="0 0 24 24"><use href="#i-person"/></svg>Tôi</button>
    </nav>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16.5 16.5 21 21"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-mappin" viewBox="0 0 24 24"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3.5 22 20H2L12 3.5z"/><path d="M12 10v5"/><path d="M12 17.5h.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5z"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.6 5.6L3 18v3h3l5.9-5.9a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.5-2.5 2.5-2.5z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.8-3.2 4.2-4.5 7-4.5s5.2 1.3 7 4.5"/></symbol>
  </svg>

  <script>
    /** Proto only — ship = GET mobile-bff/api/v1/patrol/nghiem-thu · cấm demoItems SSOT */
    const DEMO = [
      { id: '1', code: 'NT-20260906-0001', sub: 'Mẫu 03 · QL.1 Km 12+100 · Khu I', status: 'draft', label: 'Nháp', tone: 'blue' },
      { id: '2', code: 'NT-20260905-0012', sub: 'Mẫu 07 · ảnh + video hiện trường', status: 'done', label: 'Hoàn thành', tone: 'green' }
    ];
    const emptyMode = location.search.includes('empty=1');
    const failMode = location.search.includes('fail=1');

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    function render(rows) {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      if (!rows.length) {
        list.innerHTML = '';
        empty.classList.add('show');
        return;
      }
      empty.classList.remove('show');
      list.innerHTML = rows.map((r) =>
        '<button type="button" class="list-row" role="listitem" data-id="' + r.id + '" onclick="goDetail(\'' + r.id + '\')">' +
        '<div class="row-ico' + (r.tone === 'blue' ? ' blue' : '') + '"><svg viewBox="0 0 24 24"><use href="#i-check"/></svg></div>' +
        '<div class="row-body"><div class="row-title">' + r.code + '</div><div class="row-sub">' + r.sub + '</div></div>' +
        '<span class="badge ' + r.tone + '">' + r.label + '</span>' +
        '<svg class="chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg></button>'
      ).join('');
    }

    function filter() {
      const q = (document.getElementById('search').value || '').trim().toLowerCase();
      const base = emptyMode || failMode ? [] : DEMO;
      if (!q) { render(base); return; }
      render(base.filter((r) => (r.code + ' ' + r.sub + ' ' + r.label).toLowerCase().includes(q)));
    }

    document.getElementById('search').addEventListener('input', filter);

    if (failMode) {
      render([]);
      setTimeout(function () { toast('Không tải được danh sách nghiệm thu'); }, 400);
    } else if (emptyMode) {
      render([]);
    } else {
      render(DEMO);
    }

    function goBack() { toast('← Tuần đường (patrol-home)'); }
    function goCreate() { toast('→ nghiem-thu-create (sibling pending_confirm)'); }
    function goDetail(id) { toast('→ nghiem-thu-detail · Id=' + id + ' (sibling pending_confirm)'); }
  </script>
</body>
</html>
