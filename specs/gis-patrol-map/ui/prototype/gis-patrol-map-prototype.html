<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype — Bản đồ Tuần đường (gis-patrol-map)</title>
  <style>
    :root { --teal:#0d9488; --road:#0C84C0; --ok:#3CB448; --pending:#dc2626; --border:#c5d0dc; --muted:#64748b; --bg:#f1f5f9; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, sans-serif; color: #0f172a; background: var(--bg); }
    .page { display: flex; flex-direction: column; height: 100%; }
    .nav { display: flex; gap: 4px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; }
    .nav span { padding: 6px 10px; border-radius: 6px; color: var(--muted); }
    .nav span.on { background: #ecfdf5; color: #065f46; }
    .body { display: flex; flex: 1; min-height: 0; }
    .side { width: 320px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tabs span { flex: 1; text-align: center; font-size: 12px; font-weight: 700; padding: 10px 4px; color: var(--muted); }
    .tabs span.on { color: var(--teal); border-bottom: 2px solid var(--teal); }
    .panel { flex: 1; overflow: auto; padding: 10px 12px; }
    .person { display: flex; flex-direction: column; gap: 2px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
    .person.on { border-color: var(--teal); background: #f0fdfa; }
    .person strong { font-size: 13px; }
    .person .meta { font-size: 12px; color: var(--muted); }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #ecfdf5; color: #065f46; width: fit-content; }
    .badge.pending { background: #fef2f2; color: #991b1b; }
    .hist { font-size: 12px; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
    .hist h3 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; letter-spacing: .04em; }
    .hist button { display: block; width: 100%; text-align: left; border: 1px solid #e2e8f0; background: #fff; border-radius: 6px; padding: 8px; margin-bottom: 6px; cursor: pointer; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .map-host { flex: 1; min-height: 0; background: linear-gradient(160deg, #aad3df 0%, #c5d5c0 42%, #e8e4d4 100%); position: relative; }
    .map-host .track { position: absolute; left: 10%; top: 46%; width: 72%; height: 0; border-top: 5px solid var(--road); box-shadow: 0 0 0 2px #7dd3fc; transform: rotate(-6deg); }
    .map-host .pin { position: absolute; width: 22px; height: 28px; }
    .map-host .pin i { display: block; width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .map-host .pin.ok i { background: var(--ok); }
    .map-host .pin.wait i { background: var(--pending); }
    .map-host .pin b { position: absolute; left: 0; right: 0; top: 26px; text-align: center; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .map-host .rider { position: absolute; left: 42%; top: 40%; width: 14px; height: 14px; background: #0ea5e9; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .map-host .zoom { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .map-host .zoom button { width: 28px; height: 28px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; font-weight: 700; }
    .popup { position: absolute; left: 54%; top: 22%; width: 260px; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(15,23,42,.18); padding: 10px 12px; font-size: 12px; border: 1px solid var(--border); }
    .popup strong { display: block; margin-bottom: 6px; font-size: 13px; }
    .popup .row { margin: 0 0 4px; color: #334155; }
    .popup .row span { color: var(--muted); }
    .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .gallery .cell { aspect-ratio: 4/3; background: #e2e8f0; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); border: 1px dashed #94a3b8; }
    .empty { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .map-bar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #f8fafc; border-top: 1px solid var(--border); font-size: 12px; flex-shrink: 0; }
    .map-bar button { border: 1px solid #e2e8f0; background: #fff; border-radius: 6px; padding: 5px 10px; font-weight: 700; cursor: pointer; }
    .map-bar button.on { background: var(--teal); color: #fff; border-color: var(--teal); }
  </style>
</head>
<body>
  <div class="page" data-feature="gis-patrol-map" data-kind="F" data-form-pattern="full-page-map" data-real-view-parity="v1">
    <nav class="nav" data-zone="NAV-GIS" aria-label="Điều hướng GIS">
      <span>Bản đồ tài sản</span>
      <span class="on">Tuần đường</span>
      <span>Camera</span>
    </nav>

    <div class="body">
      <aside class="side">
        <div class="tabs" role="tablist" aria-label="Sidebar tuần đường">
          <span class="on" data-zone="TAB-ROAD">Tuần đường</span>
          <span data-zone="TAB-CHECK">Tuần kiểm</span>
          <span data-zone="TAB-DETAIL">Chi tiết</span>
        </div>

        <div class="panel" data-zone="LIST-PERSON">
          <div class="person on">
            <strong>Nguyễn Văn A</strong>
            <div class="meta">QL.1 · Bến Thủy → Nghi Lộc</div>
            <span class="badge">Đang tuần</span>
          </div>
          <div class="person">
            <strong>Trần Thị B</strong>
            <div class="meta">QL.46 · đoạn Vinh</div>
            <span class="badge pending">Chưa bắt đầu</span>
          </div>

          <div class="hist" data-zone="TAB-DETAIL">
            <h3>Lịch sử hoạt động</h3>
            <button type="button" title="Mở ảnh tuần đường">
              Km 127+200 · 08:15 · GPS ok
              <div class="gallery" data-zone="GALLERY-PATROL" aria-label="Ảnh tuần đường (Chi tiết)">
                <div class="cell">Ảnh 1</div>
                <div class="cell">Ảnh 2</div>
              </div>
            </button>
            <button type="button">
              Km 128+050 · Chưa
              <p class="empty">Chưa có ảnh</p>
            </button>
          </div>
        </div>
      </aside>

      <div class="main">
        <div class="map-host" data-zone="MAP-HOST">
          <div class="zoom" aria-label="Thu phóng">
            <button type="button" title="Phóng to">+</button>
            <button type="button" title="Thu nhỏ">−</button>
          </div>
          <div class="track" title="Nét tuần OSRM" data-control="map.track"></div>
          <div class="rider" title="Người tuần"></div>
          <div class="pin ok" style="left:28%;top:36%;" data-control="map.pinDone"><i></i><b>08:15</b></div>
          <div class="pin wait" style="left:58%;top:48%;" data-control="map.pinPending"><i></i><b>Chưa</b></div>

          <div class="popup" data-zone="MAP-POPUP-INSPECT" role="dialog" aria-label="Chi tiết điểm tuần">
            <strong data-control="inspect.label">Điểm tuần · Km 127+200</strong>
            <div class="row" data-control="inspect.gps"><span>GPS:</span> 18.6796, 105.6813</div>
            <div class="row" data-control="inspect.status"><span>Trạng thái:</span> Đã check-in</div>
            <div class="row" data-control="inspect.content"><span>Ghi chú:</span> Mặt đường khô</div>
            <div class="gallery" data-zone="GALLERY-PATROL" data-control="inspect.photoIds" aria-label="Ảnh tuần đường">
              <div class="cell">Ảnh 1</div>
              <div class="cell">Ảnh 2</div>
            </div>
          </div>
        </div>

        <div class="map-bar" role="toolbar" aria-label="Thanh bản đồ" data-zone="MAP-BAR">
          <div role="group" aria-label="Lớp nền" data-control="map.basemapChip">
            <button type="button" class="on" title="Nền tiêu chuẩn">Tiêu chuẩn</button>
            <button type="button" title="Nền vệ tinh">Vệ tinh</button>
          </div>
          <button type="button" title="Vị trí của tôi" data-control="map.btnLocateMe">Vị trí của tôi</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
