appId: org.linmsoft.rmms
---
# patrol-offline · guest home → login → tab Tôi → #row-offline → #sc-patrol-offline (Pixel 1080×1920)
# Login: Back+scroll btn-login (cấm Enter) · live-only EmptyChrome · cấm demo card assert
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
# Login: Back dismiss IME + scroll btn-login · cấm title-tap/Enter (GAP-QA-STORE-03)
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- pressKey: Back
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Back
- scrollUntilVisible:
    element:
      id: "btn-login"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "btn-login"
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible:
      id: "row-offline"
    timeout: 15000
- tapOn:
    id: "row-offline"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-offline"
    timeout: 20000
- assertVisible: "Dữ liệu lưu trữ"
- assertVisible:
    id: "offline-empty"
- takeScreenshot: P6-CORE
- assertVisible: "Chưa có bản ghi chờ gửi"
- takeScreenshot: P6-CORE-2
- assertVisible:
    id: "sc-patrol-offline"
