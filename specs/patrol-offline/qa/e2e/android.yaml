appId: org.linmsoft.rmms
---
# patrol-offline · guest home → login → tab Tôi → #row-offline → #sc-patrol-offline (Pixel 1080×1920)
# live-only · EmptyChrome (cleanup_mock · cấm demo card assert)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "tab-me"
- extendedWaitUntil:
    visible:
      id: "row-offline"
    timeout: 15000
- tapOn:
    id: "row-offline"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-offline"
    timeout: 20000
- assertVisible: "Dữ liệu lưu trữ"
- assertVisible:
    id: "offline-empty"
- takeScreenshot: P6-CORE
- assertVisible: "Chưa có bản ghi chờ gửi"
- takeScreenshot: P6-CORE-2
- assertVisible:
    id: "sc-patrol-offline"
