appId: org.linmsoft.rmms
---
# patrol-offline · guest home → login → tab Tôi → #row-offline → #sc-patrol-offline
# live-only · EmptyChrome (cleanup_mock · cấm demo card assert)
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
    optional: true
- tapOn:
    text: "Tài khoản"
    optional: true
- inputText: "linm-soft"
- tapOn:
    id: "f-pass"
    optional: true
- tapOn:
    text: "Mật khẩu"
    optional: true
- inputText: "Linm@2026"
- tapOn:
    text: "RMMS"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 30000
- tapOn:
    id: "tab-me"
    optional: true
- tapOn:
    text: "Tôi"
- extendedWaitUntil:
    visible: "Hàng đợi mất sóng"
    timeout: 15000
- tapOn:
    id: "row-offline"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-offline"
    timeout: 20000
- assertVisible:
    id: "offline-empty"
- assertVisible: "Chưa có bản ghi chờ gửi"
- assertVisible: "Dữ liệu mất sóng sẽ hiện khi thiết bị ghi cục bộ."
- takeScreenshot: A3-CORE
