appId: org.linmsoft.rmms
---
# cam-patrol · store A11/A9/A3 · guest → login → tab field → #sc-cam-patrol
# pattern: patrol-checkin (sc-home → btn-home-login · eraseText) · cấm A3 trước login · cấm mfeStdUrl
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- tapOn:
    id: "tab-field"
    optional: true
- tapOn:
    id: "tile-patrol"
    optional: true
- tapOn:
    text: "Tuần đường"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- assertVisible:
    id: "patrol-hero"
- scroll
- scroll
- extendedWaitUntil:
    visible:
      id: "row-quick-cam-patrol"
    timeout: 15000
    optional: true
- tapOn:
    id: "row-quick-cam-patrol"
    optional: true
- tapOn:
    text: "Thu thập bằng camera"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    text: "While Using the App"
    optional: true
- tapOn:
    text: "Allow While Using App"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-cam-patrol"
    timeout: 25000
- assertVisible: "Thu thập bằng camera"
- assertVisible:
    id: "finder"
    optional: true
- takeScreenshot: A3-CORE
- scroll
- takeScreenshot: P6-CORE-2
