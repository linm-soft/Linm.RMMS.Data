    timeout: 15000
- tapOn:
    id: "row-quick-cam-patrol"
- tapOn:
    text: "Thu thập bằng camera"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "ONLY THIS TIME"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true
- tapOn:
    text: "Allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-cam-patrol"
    timeout: 25000
- assertVisible: "Thu thập bằng camera"
- takeScreenshot: P6-CORE
- scroll
- assertVisible:
    id: "btn-confirm"
    optional: true
- assertVisible:
    id: "btn-skip"
    optional: true
- takeScreenshot: P6-CORE-2
