appId: org.linmsoft.rmms
---
# cam-patrol · store P6 ×2 · guest → login → tab field → #sc-cam-patrol (Pixel 1080×1920)
# Android login: IME Enter/Next · cấm eraseText · cấm hideKeyboard (GAP-QA-STORE-03)
# pattern: supervise android · cấm mfeStdUrl / start:std
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- inputText: "linm-soft"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 1500
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- tapOn:
    id: "tab-field"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
