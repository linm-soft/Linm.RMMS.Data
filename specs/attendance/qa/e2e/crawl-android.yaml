appId: org.linmsoft.rmms
---
# crawl · attendance
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "btn-home-login"
    optional: true
- tapOn:
    text: "Dành cho cán bộ"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "rmms-admin"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "RMMS@2026"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-who"
    timeout: 40000

- tapOn:
    id: "tab-field"
    optional: true
- tapOn:
    text: "Tuần đường"
    optional: true
- tapOn:
    point: "30%,96%"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- tapOn:
    text: "Chấm công"
- extendedWaitUntil:
    visible:
      id: "sc-attendance"
    timeout: 20000

- tapOn:
    text: "Báo cáo công"
- extendedWaitUntil:
    visible:
      id: "sc-attendance-report"
    timeout: 8000
- takeScreenshot: CRAWL-report
- tapOn:
    id: "nav-back"
    optional: true
- tapOn:
    id: "btn-faq-back"
    optional: true
- tapOn:
    id: "btn-privacy-back"
    optional: true
- tapOn:
    text: "Về Trang Chủ"
    optional: true
