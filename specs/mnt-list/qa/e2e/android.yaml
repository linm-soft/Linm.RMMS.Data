appId: org.linmsoft.rmms
---
# mnt-list · store P6 ×2 · cold start guest #sc-home → login → tile-mnt / tab-work → #sc-mnt-list (Pixel 1080×1920)
# cấm hideKeyboard (BACK có thể về launcher) — tap title + Enter như home/patrol-history
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "tile-mnt"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "tile-mnt"
    optional: true
- tapOn:
    id: "tab-work"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-mnt-list"
    timeout: 25000
- assertVisible: "Danh sách công việc"
- assertVisible: "Giao việc xử lý"
- assertVisible: "Vá mặt đường"
- assertVisible: "Tình trạng xử lý: Chờ xử lý"
- assertVisible:
    id: "row-mnt-hub"
- assertVisible:
    id: "btn-mnt-filter"
- takeScreenshot: P6-CORE
- scrollUntilVisible:
    element: "Tình trạng xử lý: Đã hoàn thành"
    direction: DOWN
    timeout: 15000
- assertVisible: "Nạo cống"
- assertVisible: "Tình trạng xử lý: Đã hoàn thành"
- assertVisible: "Tuyến HCM"
- takeScreenshot: P6-CORE-2
- assertVisible:
    id: "sc-mnt-list"
