<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Tôi · Android</title>
  <style>
    :root { --blue:#0C84C0; --danger:#F03C30; --surface:#F2F2F7; --card:#fff; --label:#1C1C1E; --muted:#8E8E93; --green:#1B8A4A; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Roboto,sans-serif; background:#1c1c1e; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .phone { width:412px; height:915px; background:var(--surface); border-radius:28px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
    .content { flex:1; overflow:auto; padding:24px 0 88px; }
    .large { font-size:34px; font-weight:700; padding:8px 16px 12px; }
    .label { font-size:13px; color:var(--muted); text-transform:uppercase; padding:12px 16px 6px; }
    .card { background:var(--card); margin:0 16px 8px; border-radius:16px; padding:12px; display:flex; align-items:center; gap:12px; }
    .ico { width:30px; height:30px; border-radius:7px; background:var(--blue); color:#fff; display:grid; place-items:center; font-size:13px; flex:0 0 30px; }
    .ico.circle { width:40px; height:40px; border-radius:20px; flex-basis:40px; }
    .ico.ghost { background:transparent; }
    .t { font-size:16px; }
    .s { font-size:13px; color:var(--muted); margin-top:1px; }
    .danger { color:var(--danger); }
    .tab { position:absolute; left:0; right:0; bottom:0; height:80px; background:#fff; border-top:1px solid #E5E5EA; display:flex; padding:8px 4px 16px; }
    .tab b { flex:1; text-align:center; font-size:13px; font-weight:500; color:var(--muted); }
    .tab b.on { color:var(--blue); }
  </style>
</head>
<body>
  <div class="phone" id="sc-me" data-des-id="DES-MOB-ME">
    <div class="content">
      <div class="large">Tôi</div>
      <div class="card"><div class="ico circle">👤</div><div><div class="t">Tên tài khoản</div><div class="s">Hồ sơ phiên</div></div></div>
      <div class="label">Đồng bộ</div>
      <div class="card"><div class="ico" style="background:#E65100">↻</div><div><div class="t">Hàng đợi mất sóng</div><div class="s">0 chờ đồng bộ</div></div></div>
      <div class="card"><div class="ico" style="background:var(--green)">📶</div><div><div class="t">Tín hiệu</div><div class="s">Tốt</div></div></div>
      <div class="label">Cập nhật thông tin</div>
      <div class="card"><div class="ico" style="background:var(--green)">i</div><div><div class="t">Góp ý</div><div class="s">Phản ánh tính năng phần mềm</div></div></div>
      <div class="card"><div class="ico" style="background:#6750A4">▶</div><div class="t">Camera xem</div></div>
      <div class="card"><div class="ico">🔔</div><div class="t">Thông báo</div></div>
      <div class="card"><div class="ico" style="background:#8E8E93">⚙</div><div class="t">Cài đặt</div></div>
      <div class="card"><div class="ico ghost"></div><div class="t danger">Đăng xuất</div></div>
    </div>
    <nav class="tab" data-des-id="DES-MOB-TABBAR">
      <b>Trang Chủ</b><b>Tuần đường</b><b>Vấn đề</b><b>Công việc</b><b class="on">Tôi</b>
    </nav>
  </div>
</body>
</html>
