<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Tôi · iOS</title>
  <style>
    :root { --blue:#0C84C0; --danger:#F03C30; --surface:#F2F2F7; --card:#fff; --label:#1C1C1E; --muted:#8E8E93; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; background:#1c1c1e; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .phone { width:390px; height:844px; background:var(--surface); border-radius:44px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
    .content { flex:1; overflow:auto; padding:54px 0 90px; }
    .large { font-size:34px; font-weight:700; padding:8px 16px 12px; }
    .label { font-size:13px; color:var(--muted); text-transform:uppercase; padding:12px 16px 6px; }
    .card { background:var(--card); margin:0 16px 8px; border-radius:16px; padding:12px; display:flex; align-items:center; gap:12px; }
    .ico { width:30px; height:30px; border-radius:7px; background:var(--blue); color:#fff; display:grid; place-items:center; font-size:13px; flex:0 0 30px; }
    .ico.circle { width:44px; height:44px; border-radius:22px; flex-basis:44px; }
    .ico.ghost { background:transparent; }
    .t { font-size:17px; }
    .s { font-size:13px; color:var(--muted); margin-top:1px; }
    .chev { color:#C7C7CC; margin-left:auto; }
    .danger { color:var(--danger); }
    .tab { position:absolute; left:0; right:0; bottom:0; height:83px; background:rgba(255,255,255,.92); border-top:0.5px solid #C7C7CC; display:flex; padding:6px 4px 28px; }
    .tab b { flex:1; text-align:center; font-size:13px; font-weight:500; color:var(--muted); }
    .tab b.on { color:var(--blue); }
  </style>
</head>
<body>
  <div class="phone" id="sc-me" data-des-id="DES-MOB-ME">
    <div class="content">
      <div class="large">Tôi</div>
      <div class="card"><div class="ico circle">👤</div><div><div class="t">Tên tài khoản</div><div class="s">Hồ sơ phiên</div></div><span class="chev">›</span></div>
      <div class="label">Đồng bộ</div>
      <div class="card"><div class="ico" style="background:#E65100">↻</div><div><div class="t">Hàng đợi mất sóng</div><div class="s">0 chờ đồng bộ</div></div><span class="chev">›</span></div>
      <div class="card"><div class="ico" style="background:#3CB448">▂</div><div><div class="t">Tín hiệu</div><div class="s">Tốt</div></div></div>
      <div class="label">Cập nhật thông tin</div>
      <div class="card"><div class="ico">i</div><div><div class="t">Góp ý</div><div class="s">Phản ánh tính năng phần mềm</div></div><span class="chev">›</span></div>
      <div class="card"><div class="ico">▶</div><div class="t">Camera xem</div><span class="chev">›</span></div>
      <div class="card"><div class="ico">🔔</div><div class="t">Thông báo</div><span class="chev">›</span></div>
      <div class="card"><div class="ico" style="background:#8E8E93">⚙</div><div class="t">Cài đặt</div><span class="chev">›</span></div>
      <div class="card"><div class="ico" style="background:var(--danger)">→</div><div class="t danger">Đăng xuất</div></div>
    </div>
    <nav class="tab" data-des-id="DES-MOB-TABBAR">
      <b>Trang Chủ</b><b>Tuần đường</b><b>Vấn đề</b><b>Công việc</b><b class="on">Tôi</b>
    </nav>
  </div>
</body>
</html>
