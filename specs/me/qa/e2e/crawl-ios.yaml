appId: org.linmsoft.rmms
---
# crawl · me
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "btn-home-login"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-who"
    timeout: 40000

- tapOn:
    text: "Hồ sơ"
- extendedWaitUntil:
    visible:
      id: "title-me"
    timeout: 15000

- tapOn:
    id: "row-profile"
- extendedWaitUntil:
    visible:
      id: "sc-me-profile"
    timeout: 8000
- takeScreenshot: CRAWL-profile
- tapOn:
    id: "nav-back"
    optional: true

- tapOn:
    id: "row-offline"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-offline"
    timeout: 8000
- takeScreenshot: CRAWL-offline
- tapOn:
    id: "tab-me"
    optional: true
- tapOn:
    text: "Tôi"
    optional: true
- tapOn:
    point: "90%,96%"
    optional: true
- tapOn:
    text: "Tôi"
    optional: true
- tapOn:
