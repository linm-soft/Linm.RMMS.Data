appId: org.linmsoft.rmms
---
# patrol-history · store A11/A9/A3 · login Auth seed → tab field → hub → #sc-patrol-history
# cấm shot login-only cho A3 · cấm mfeStdUrl / start:std
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Đăng nhập"
    timeout: 15000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "f-user"
    optional: true
- tapOn:
    text: "Tài khoản"
    optional: true
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
    optional: true
- tapOn:
    text: "Mật khẩu"
    optional: true
- inputText: "Linm@2026"
- tapOn:
    text: "Not Now"
    optional: true
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 30000
- tapOn:
    id: "tab-field"
    optional: true
- tapOn:
    id: "tile-patrol"
    optional: true
- tapOn:
    text: "Tuần đường"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "row-quick-patrol-history"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "row-quick-patrol-history"
    optional: true
- tapOn:
    text: "Lịch sử phiên"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-history"
    timeout: 20000
- assertVisible: "Lịch sử ca"
- assertVisible: "Lọc"
- assertVisible: "Hoàn thành"
- assertVisible: "Mất sóng"
- takeScreenshot: A3-CORE
