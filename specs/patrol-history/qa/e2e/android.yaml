appId: org.linmsoft.rmms
---
# patrol-history · store P6 ×2 · login Auth seed → tab field → hub → #sc-patrol-history (Pixel 1080×1920)
# cấm hideKeyboard (BACK có thể về launcher) — tap title + Enter như patrol-home
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "Đăng nhập"
    timeout: 15000
- tapOn:
    id: "f-user"
- inputText: "linm-soft"
- tapOn: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
- tapOn:
    id: "f-pass"
- inputText: "Linm@2026"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- extendedWaitUntil:
    visible: "Trang Chủ"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "tab-field"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "row-quick-patrol-history"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "row-quick-patrol-history"
    optional: true
- tapOn:
    text: "Lịch sử phiên"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-history"
    timeout: 20000
- assertVisible: "Lịch sử ca"
- assertVisible: "Lọc"
- assertVisible: "Hoàn thành"
- takeScreenshot: P6-CORE
- scrollUntilVisible:
    element: "Mất sóng"
    direction: DOWN
    timeout: 10000
    optional: true
- assertVisible: "Mất sóng"
- takeScreenshot: P6-CORE-2
- assertVisible:
    id: "sc-patrol-history"
