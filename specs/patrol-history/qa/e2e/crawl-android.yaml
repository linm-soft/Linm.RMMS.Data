appId: org.linmsoft.rmms
---
# crawl · patrol-history
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 15000
- tapOn:
    id: "btn-home-login"
    optional: true
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "f-pass"
- eraseText
- inputText: "Linm@2026"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    text: "RMMS"
    optional: true
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-who"
    timeout: 40000

- tapOn:
    id: "tab-field"
    optional: true
- tapOn:
    text: "Tuần đường"
    optional: true
- tapOn:
    point: "30%,96%"
    optional: true
- tapOn:
    id: "row-quick-patrol-history"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-history"
    timeout: 20000

- tapOn:
    text: "Lọc"
- extendedWaitUntil:
    visible:
      id: "sc-patrol-history-filter"
    timeout: 8000
- takeScreenshot: CRAWL-filter
- tapOn:
    id: "nav-back"
    optional: true
