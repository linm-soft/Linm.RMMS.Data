<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mnt-chat · iOS</title>
  <style>
    body { margin: 0; font-family: -apple-system, sans-serif; background: #F2F2F7; color: #1C1C1E; }
    header { height: 56px; background: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
    .sub { background: #fff; padding: 6px 16px; font-size: 12px; color: #8E8E93; }
    .thread { padding: 16px; min-height: 420px; }
    .row { display: flex; margin: 10px 0; }
    .row.mine { justify-content: flex-end; }
    .bubble { max-width: 72%; padding: 8px 12px; border-radius: 12px; font-size: 16px; }
    .theirs { background: #fff; }
    .mine { background: #0C84C0; color: #fff; }
    .composer { display: flex; gap: 8px; padding: 10px 16px; background: #F2F2F7; }
    .composer input { flex: 1; height: 44px; border: 0; border-radius: 12px; padding: 0 12px; }
    .send { width: 44px; height: 44px; border-radius: 22px; background: #0C84C0; color: #fff; border: 0; }
  </style>
</head>
<body id="sc-mnt-chat">
  <header>Trao đổi công việc</header>
  <div class="sub">Vá mặt đường · WO-DEMO-1</div>
  <div class="thread">
    <div class="row"><div class="bubble theirs">Xác nhận khối lượng vá mặt đường.</div></div>
    <div class="row mine"><div class="bubble mine">Đã nhận. Bắt đầu sáng mai.</div></div>
  </div>
  <div class="composer">
    <input placeholder="Nhập tin nhắn…" />
    <button class="send" type="button">➤</button>
  </div>
</body>
</html>
