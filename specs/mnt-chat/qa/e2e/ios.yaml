appId: org.linmsoft.rmms
---
# mnt-chat · store A11/A9/A3 · guest → login → tile-mnt → #sc-mnt-list → #i-chat → #sc-mnt-chat
# Seed WO-DEMO-1 id 11111111-1111-1111-1111-111111111101 · cấm toast-only · cấm mfeStdUrl
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 20000
- takeScreenshot: A11-LAUNCH
- tapOn:
    id: "btn-home-login"
- extendedWaitUntil:
    visible:
      id: "f-user"
    timeout: 15000
- tapOn:
    id: "f-user"
    optional: true
- eraseText
- inputText: "linm-soft"
- tapOn:
    text: "QUẢN LÝ BẢO TRÌ ĐƯỜNG BỘ"
    optional: true
- tapOn:
    id: "f-pass"
    optional: true
- eraseText
- inputText: "Linm@2026"
- takeScreenshot: A9-LOGIN
- tapOn:
    id: "btn-login"
    optional: true
- tapOn:
    text: "Đăng nhập"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "sc-home"
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "tile-mnt"
    direction: DOWN
    timeout: 15000
    optional: true
- tapOn:
    id: "tile-mnt"
    optional: true
- tapOn:
    id: "tab-work"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-mnt-list"
    timeout: 25000
- assertVisible: "Danh sách công việc"
- assertVisible: "Vá mặt đường"
- tapOn:
    id: "btn-mnt-chat-11111111-1111-1111-1111-111111111101"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "sc-mnt-chat"
    commands:
      - tapOn:
          text: "Trao đổi"
          optional: true
      - tapOn:
          point: "88%,42%"
- extendedWaitUntil:
    visible:
      id: "sc-mnt-chat"
    timeout: 15000
- assertVisible: "Trao đổi công việc"
- assertVisible:
    id: "sc-mnt-chat"
- takeScreenshot: A3-CORE
