<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Tạo nghiệm thu · Android</title>
  <style>
    :root {
      --blue: #0C84C0; --green: #34C759; --orange: #FF9500; --danger: #E53935;
      --surface: #F2F2F7; --card: #fff; --label: #1C1C1E; --muted: #8E8E93;
      --sep: rgba(60,60,67,.29); --gray3: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Roboto", "Noto Sans", sans-serif;
      background: #1c1c1e; color: var(--label);
    }
    .phone {
      width: 412px; height: 915px; background: var(--surface); border-radius: 28px;
      overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: flex; flex-direction: column;
    }
    .status-bar { height: 36px; flex-shrink: 0; }
    .top-bar {
      display: flex; align-items: center; gap: 4px; padding: 8px 8px 12px;
      background: var(--card); border-bottom: 1px solid var(--sep);
    }
    .icon-btn {
      width: 40px; height: 40px; border: 0; background: none; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--label);
    }
    .icon-btn svg {
      width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .nav-title { flex: 1; font-size: 20px; font-weight: 600; }
    .nav-trail {
      border: 0; background: none; color: var(--blue); font-size: 16px; font-weight: 600;
      cursor: pointer; padding: 8px 12px; font-family: inherit;
    }
    .nav-trail:disabled { opacity: .4; cursor: not-allowed; }
    .content { flex: 1; overflow: auto; padding-bottom: 96px; }
    .list { margin: 12px 16px; background: var(--card); border-radius: 16px; overflow: hidden; }
    .list-row {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px;
      border-bottom: 1px solid var(--sep); cursor: pointer; background: none; width: 100%;
      text-align: left; font-family: inherit; color: inherit;
    }
    .list-row:last-child { border-bottom: 0; }
    .list-row svg.leading {
      width: 22px; height: 22px; stroke: var(--blue); fill: none; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .row-body { flex: 1; min-width: 0; }
    .row-sub { font-size: 13px; color: var(--muted); }
    .row-title { font-size: 16px; font-weight: 600; margin-top: 2px; }
    .list-row svg.chev {
      width: 18px; height: 18px; stroke: var(--gray3); fill: none; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .section-label {
      font-size: 13px; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.4px; padding: 16px 16px 6px;
    }
    .photo-row { display: flex; gap: 10px; margin: 0 16px 12px; overflow-x: auto; }
    .photo-slot {
      width: 88px; height: 88px; flex-shrink: 0; border-radius: 12px; background: var(--card);
      border: 1.5px dashed var(--gray3); display: grid; place-items: center; color: var(--blue);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .photo-slot.filled {
      border: 0; background: linear-gradient(135deg, #5ac8fa, #0C84C0); color: #fff;
    }
    .photo-slot svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .toast {
      position: absolute; left: 24px; right: 24px; bottom: 110px; z-index: 20;
      background: #323232; color: #fff; font-size: 14px;
      padding: 12px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s;
      pointer-events: none; text-align: center;
    }
    .toast.show { opacity: 1; }
    .backdrop {
      position: absolute; inset: 0; background: rgba(0,0,0,.4); display: none;
      align-items: flex-end; justify-content: center; z-index: 30;
    }
    .backdrop.center { align-items: center; padding: 24px; }
    .backdrop.open { display: flex; }
    .modal {
      background: var(--card); border-radius: 28px; padding: 24px 20px 16px; width: 100%;
    }
    .sheet {
      background: var(--card); border-radius: 28px 28px 0 0; padding: 12px 0 28px; width: 100%;
      max-height: 70%; overflow: auto;
    }
    .sheet h3, .modal h3 { font-size: 20px; margin: 0 20px 8px; font-weight: 600; }
    .modal p { font-size: 14px; color: var(--muted); margin: 0 0 16px; line-height: 1.4; }
    .modal .btn { margin: 0 0 8px; width: 100%; }
    .btn {
      border: 0; border-radius: 28px; padding: 14px 16px; font-size: 16px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--label); }
    .btn-danger { background: var(--danger); color: #fff; }
    .opt {
      display: block; width: 100%; border: 0; background: none; text-align: left;
      padding: 14px 20px; font-size: 16px; font-family: inherit; color: var(--label);
      border-bottom: 1px solid var(--sep); cursor: pointer;
    }
    .opt.on { color: var(--blue); font-weight: 600; }
    .opt:last-child { border-bottom: 0; }
    .nav {
      position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
      background: var(--card); border-top: 1px solid var(--sep);
      display: flex; padding: 8px 0 16px; z-index: 10;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; color: var(--muted); background: none; border: 0; cursor: pointer;
    }
    .tab.on { color: var(--blue); }
    .tab svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar" aria-hidden="true"></div>

    <div class="screen active" id="sc-nghiem-thu-create" data-des-id="DES-MOB-NGHIEM-THU-CREATE" data-tab="field">
      <div class="top-bar">
        <button type="button" class="icon-btn" id="btn-cancel" onclick="onCancel()" aria-label="Quay lại">
          <svg viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
        </button>
        <div class="nav-title">Tạo nghiệm thu</div>
        <button type="button" class="nav-trail" id="btn-save" onclick="onSave()">Lưu</button>
      </div>
      <div class="content">
        <div class="list">
          <button type="button" class="list-row" id="row-template" onclick="openMau()">
            <div class="row-body">
              <div class="row-sub">Mẫu</div>
              <div class="row-title" id="val-template">Mẫu nghiệm thu 03</div>
            </div>
            <svg class="chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
          </button>
          <button type="button" class="list-row" id="row-location" onclick="onLoc()">
            <svg class="leading" viewBox="0 0 24 24"><use href="#i-mappin"/></svg>
            <div class="row-body">
              <div class="row-sub">Vị trí</div>
              <div class="row-title" id="val-location">Khu I · GPS hiện trường</div>
            </div>
            <svg class="chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
          </button>
          <button type="button" class="list-row" id="row-attach" onclick="openCapture()">
            <div class="row-body">
              <div class="row-sub">Đính kèm</div>
              <div class="row-title" id="val-attach">Ảnh + video</div>
            </div>
            <svg class="chev" viewBox="0 0 24 24"><use href="#i-chevron-right"/></svg>
          </button>
        </div>
        <div class="section-label">Ảnh hiện trường</div>
        <div class="photo-row" id="photo-row">
          <div class="photo-slot" onclick="openCapture()" aria-label="Chụp ảnh">
            <svg viewBox="0 0 24 24"><use href="#i-camera"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <div class="backdrop center" id="modal-gps" data-des-id="DES-MOB-GPS-DENY">
      <div class="modal">
        <h3>Định vị bị tắt</h3>
        <p>Cần vị trí để chấm công / chấm điểm tuần. Mở Cài đặt → Quyền vị trí cho RMMS.</p>
        <button type="button" class="btn btn-primary" onclick="copyGuide()">Sao chép hướng dẫn</button>
        <button type="button" class="btn btn-secondary" onclick="closeGps()">Để sau</button>
      </div>
    </div>

    <div class="backdrop center" id="modal-leave" data-des-id="DES-MOB-LEAVE">
      <div class="modal">
        <h3>Huỷ thay đổi?</h3>
        <p>Bạn có thay đổi chưa lưu. Thoát sẽ mất dữ liệu.</p>
        <button type="button" class="btn btn-secondary" onclick="closeLeave()">Ở lại</button>
        <button type="button" class="btn btn-danger" onclick="confirmLeave()">Thoát</button>
      </div>
    </div>

    <div class="backdrop" id="sheet-mau">
      <div class="sheet">
        <h3>Chọn mẫu nghiệm thu</h3>
        <div id="mau-list"></div>
      </div>
    </div>

    <nav class="nav" aria-label="Shell Nav 5">
      <button type="button" class="tab" data-tab="home"><svg viewBox="0 0 24 24"><use href="#i-home"/></svg>Trang Chủ</button>
      <button type="button" class="tab on" data-tab="field"><svg viewBox="0 0 24 24"><use href="#i-mappin"/></svg>Tuần đường</button>
      <button type="button" class="tab" data-tab="incident"><svg viewBox="0 0 24 24"><use href="#i-warning"/></svg>Vấn đề</button>
      <button type="button" class="tab" data-tab="work"><svg viewBox="0 0 24 24"><use href="#i-wrench"/></svg>Công việc</button>
      <button type="button" class="tab" data-tab="me"><svg viewBox="0 0 24 24"><use href="#i-person"/></svg>Tôi</button>
    </nav>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4V8z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-mappin" viewBox="0 0 24 24"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3.5 22 20H2L12 3.5z"/><path d="M12 10v5"/><path d="M12 17.5h.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-8.5z"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.5a4 4 0 0 0-5.6 5.6L3 18v3h3l5.9-5.9a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.5-2.5 2.5-2.5z"/></symbol>
    <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19.5c1.8-3.2 4.2-4.5 7-4.5s5.2 1.3 7 4.5"/></symbol>
  </svg>

  <script>
    /** Pack proto · hash skip SSOT · ?deny=1 · ?fail=1 · ?dirty=1 · parity iOS */
    const q = new URLSearchParams(location.search);
    let gpsOk = !q.has('deny');
    let forceFail = q.has('fail');
    let dirty = q.has('dirty');
    let templateType = 'mau-03';
    let mediaCount = 0;

    const MAU = Array.from({ length: 10 }, (_, i) => {
      const n = String(i + 1).padStart(2, '0');
      return { id: 'mau-' + n, label: 'Mẫu nghiệm thu ' + n };
    });

    const list = document.getElementById('mau-list');
    MAU.forEach((m) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt' + (m.id === templateType ? ' on' : '');
      b.textContent = m.label;
      b.onclick = () => pickMau(m);
      list.appendChild(b);
    });

    if (!gpsOk) {
      document.getElementById('val-location').textContent = '— · chưa chốt';
      document.getElementById('btn-save').disabled = true;
      document.getElementById('modal-gps').classList.add('open');
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2400);
    }

    function openMau() {
      document.getElementById('sheet-mau').classList.add('open');
    }

    function pickMau(m) {
      templateType = m.id;
      dirty = true;
      document.getElementById('val-template').textContent = m.label;
      document.querySelectorAll('#mau-list .opt').forEach((el, i) => {
        el.classList.toggle('on', MAU[i].id === m.id);
      });
      document.getElementById('sheet-mau').classList.remove('open');
    }

    document.getElementById('sheet-mau').addEventListener('click', (e) => {
      if (e.target.id === 'sheet-mau') e.target.classList.remove('open');
    });

    function onLoc() {
      if (!gpsOk) {
        document.getElementById('modal-gps').classList.add('open');
        return;
      }
      dirty = true;
      toast('Đã cập nhật vị trí hiện trường');
    }

    function openCapture() {
      dirty = true;
      mediaCount = Math.min(10, mediaCount + 1);
      document.getElementById('val-attach').textContent = mediaCount + ' ảnh';
      const row = document.getElementById('photo-row');
      if (!row.querySelector('.filled')) {
        const slot = document.createElement('div');
        slot.className = 'photo-slot filled';
        slot.textContent = 'Ảnh';
        row.insertBefore(slot, row.firstChild);
      }
      toast('Đính kèm · FileService (max 10)');
    }

    function onSave() {
      if (!gpsOk) {
        document.getElementById('modal-gps').classList.add('open');
        return;
      }
      if (forceFail) {
        toast('Không lưu được phiếu nghiệm thu');
        return;
      }
      dirty = false;
      toast('Đã lưu nháp · NT-20260919-0001');
    }

    function onCancel() {
      if (dirty) {
        document.getElementById('modal-leave').classList.add('open');
        return;
      }
      toast('← Công tác nghiệm thu');
    }

    function closeLeave() {
      document.getElementById('modal-leave').classList.remove('open');
    }

    function confirmLeave() {
      closeLeave();
      dirty = false;
      toast('← Công tác nghiệm thu');
    }

    function copyGuide() {
      closeGps();
      toast('Đã sao chép: Cài đặt → Quyền vị trí');
    }

    function closeGps() {
      document.getElementById('modal-gps').classList.remove('open');
    }
  </script>
</body>
</html>
