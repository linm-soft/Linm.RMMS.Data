    timeout: 25000
- assertVisible:
    id: "row-template"
- assertVisible:
    id: "row-result"
- assertVisible:
    id: "row-status"
- assertVisible: "Đóng"
- assertVisible: "Sửa"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: A3-CORE
- takeScreenshot: P6-CORE
- takeScreenshot: P6-CORE-2
