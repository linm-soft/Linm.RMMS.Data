    optional: true
- tapOn:
    id: "tile-patrol"
    optional: true
- tapOn:
    text: "Tuần đường"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sc-patrol-home"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "row-nghiem-thu"
    direction: DOWN
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      text: "Công tác nghiệm thu"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "row-nghiem-thu"
    optional: true
- tapOn:
    text: "Công tác nghiệm thu"
