<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMMS · Chi tiết check-in · iOS</title>
  <style>
    :root {
      --blue: #0C84C0; --deep: #086A9A; --success: #3CB448; --warn: #FCB43C; --danger: #FF3B30;
      --surface: #F2F2F7; --card: #fff; --muted: #8E8E93; --label: #1C1C1E; --sep: #C7C7CC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: #1c1c1e; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .phone {
      width: 390px; height: 844px; background: var(--surface); border-radius: 44px;
      overflow: hidden; position: relative; display: flex; flex-direction: column;
    }
    .nav-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 54px 8px 10px; background: rgba(255,255,255,.92); border-bottom: 0.5px solid var(--sep);
      min-height: 96px;
    }
    .nav-btn {
      min-width: 44px; min-height: 44px; border: 0; background: transparent; color: var(--blue);
      font: inherit; font-size: 17px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 2px; padding: 0 8px;
    }
    .nav-title { font-size: 17px; font-weight: 600; color: var(--label); letter-spacing: -0.2px; }
    .nav-spacer { width: 88px; }
    .content { flex: 1; overflow: auto; padding: 0 0 100px; }
    .hero { padding: 16px 20px 8px; }
    .hero-name { font-size: 28px; font-weight: 700; color: var(--label); letter-spacing: -0.4px; }
    .code-label { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .code-value { font-size: 16px; font-weight: 600; color: var(--label); margin-top: 2px; }
    .card-group {
      margin: 8px 16px; background: var(--card); border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
    }
    .row { padding: 12px 16px; border-bottom: 0.5px solid #EFEFF4; }
    .row:last-child { border-bottom: 0; }
    .row-sub { font-size: 13px; color: var(--muted); }
    .row-title { font-size: 16px; font-weight: 600; color: var(--label); margin-top: 2px; }
    .row-title.ok { color: #1B5E20; }
    .cta { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .btn {
      width: 100%; min-height: 48px; border: 0; border-radius: 12px; font: inherit;
      font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.75;
      stroke-linecap: round; stroke-linejoin: round; }
    .ic-sm { width: 18px; height: 18px; }
    .tab {
      position: absolute; left: 0; right: 0; bottom: 0; height: 83px;
      background: rgba(255,255,255,.92); border-top: 0.5px solid var(--sep);
      display: flex; padding: 6px 4px 28px;
    }
    .tab b { flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); }
    .tab b.on { color: var(--blue); }
    .toast {
      position: absolute; left: 16px; right: 16px; bottom: 100px; z-index: 20;
      background: rgba(28,28,30,.92); color: #fff; border-radius: 12px;
      padding: 12px 14px; font-size: 15px; display: none;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  </svg>

  <div class="phone" id="sc-supervise-detail" data-des-id="DES-MOB-SUP-DETAIL" data-tab="home">
    <div class="nav-bar solid">
      <button type="button" class="nav-btn" aria-label="Back" onclick="toast('Giám sát')">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg> Giám sát
      </button>
      <div class="nav-title">Chi tiết check-in</div>
      <div class="nav-spacer"></div>
    </div>
    <div class="content">
      <div class="hero">
        <div class="hero-name" id="supervise-detail-hero">Nguyễn Văn A</div>
        <div class="code-label">Mã</div>
        <div class="code-value" id="supervise-detail-code">CC-20260810-001</div>
      </div>
      <div class="card-group">
        <div class="row"><div class="row-sub">Tổ / đơn vị</div><div class="row-title">Tổ tuần đường · VP-IV.1</div></div>
        <div class="row"><div class="row-sub">Tuyến · lý trình</div><div class="row-title">QL.1 Km 1556+000 · Xuân Hải</div></div>
        <div class="row"><div class="row-sub">Thời điểm</div><div class="row-title">2026-08-10 08:40:12</div></div>
        <div class="row"><div class="row-sub">Trạng thái</div><div class="row-title ok">Đã ghi điểm tuần</div></div>
        <div class="row"><div class="row-sub">Tọa độ</div><div class="row-title">11.5300, 109.0040</div></div>
        <div class="row"><div class="row-sub">Trong vùng</div><div class="row-title">Trong vùng</div></div>
      </div>
      <div class="cta">
        <button type="button" class="btn btn-primary" id="supervise-detail-map" onclick="toast('Xem trên bản đồ')">Xem trên bản đồ</button>
      </div>
    </div>
    <div class="tab" data-des-id="DES-MOB-TABBAR">
      <b class="on" id="tab-home">Trang Chủ</b><b>Tuần đường</b><b>Vấn đề</b><b>Công việc</b><b>Tôi</b>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script>
    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window.__t);
      window.__t = setTimeout(function () { el.classList.remove('show'); }, 1800);
    }
  </script>
</body>
</html>
